<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>SRF Positions Map Add-in</title>
</head>
<body>
    <div id="addin-root"></div>

    <script>
        let commitMessage = "";

        let gtbIdsAssigned = false;
        const GTB_DEVICES = {}
        const GTB_STATUSINFO = {}

        async function getLastCommitMessage() {
            try {
                const response = await fetch('https://api.github.com/repos/jmcesetti/geotabaddins/commits?per_page=1');
                const commits = await response.json();
                if (commits.length > 0) {
                    commitMessage = commits[0].commit.message.split('\n')[0];
                }
            } catch (err) {
                console.error("[debug] Could not fetch commit message:", err);
            }
        }

        let srf_token = null;
        let srf_isTokenValid = true;
        let srf_tokenCheckTimeoutId = null;
        let srf_regularRefreshIntervalId = null;
        const srf_tokenRetryDelays = [60000, 180000, 300000, 600000];
        let srf_tokenRetryIndex = 0;
        let mkp_initPromise = null;

        const ApiHelpers = (() => {
            let _api = null;
            let _session = null;
            let _sessionPromise = null;

            function init(api) {
                _api = api;
                _sessionPromise = _api.api.getSession().then(session => {
                    _session = session;
                    return session;
                }).catch(err => {
                    console.error("[Session] Error loading session:", err.message);
                    throw err;
                });
            }

            function getApi() {
                return _api;
            }

            function getSession() {
                return _session;
            }

            function getSessionPromise() {
                return _sessionPromise;
            }

            return { init, getApi, getSession, getSessionPromise };
        })();

        // ====== SURFSIGHT PIPELINE ======
        async function srf_fetchTokenFromGitHub() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/jmcesetti/geotabaddins/refs/heads/main/SRF%20Positions/token.txt');
                if (!response.ok) throw new Error(`Failed to fetch token: ${response.statusText}`);
                srf_token = (await response.text()).trim();
                return srf_token;
            } catch (err) {
                console.error("[SRF]", err.message);
                throw err;
            }
        }

        async function srf_getUnionsFromGitHub() {
            try {
                const url = "https://raw.githubusercontent.com/jmcesetti/geotabaddins/main/SRF%20Positions/unions.csv";
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to fetch unions.csv: ${response.status}`);
                const csv = await response.text();

                const lines = csv.trim().split('\n');
                const headers = lines[0].split(',').map(h => h.trim());
                const unions = [];

                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(',').map(v => v.trim());
                    const row = {};
                    headers.forEach((header, index) => {
                        row[header] = values[index];
                    });
                    unions.push(row);
                }

                return unions;
            } catch (err) {
                console.error("[SRF]", err.message);
                throw err;
            }
        }

        async function srf_getOrgIdsFromGeotab() {
            try {
                const session = await ApiHelpers.getSessionPromise();
                const unions = await srf_getUnionsFromGitHub();
                const database = session.database;
                const devices = {};
                try {
                    console.info("------------------- [GTB] -------------------");
                    const api = ApiHelpers.getApi();
                    const raw_devices = await api.api.call("Get", {
                        typeName: "Device"
                    });
                    for (const device of raw_devices) {
                        devices[device.id] = {
                            id: device.id,
                            licensePlate: device.licensePlate,
                            serialNumber: device.serialNumber,
                            name: device.name
                        };
                    }
                    // console.info(devices);
                    GTB_DEVICES = devices;
                } catch (err) {
                    console.error("[GTB] Error:", err);
                }

                const matchingUnions = unions.filter(u => u.geotab_db && u.geotab_db.toLowerCase() === database.toLowerCase());

                const allSrfIds = matchingUnions.map(u => u.id);

                const orgIdsFromCsv = allSrfIds.filter(id => id && id.toLowerCase() !== 'null');

                if (orgIdsFromCsv.length === 0) {
                    throw new Error(`No matching OrgIds found in unions.csv for database: ${database}`);
                }

                return { database, orgIdsFromCsv, allSrfIds };
            } catch (err) {
                console.error("[SRF]", err.message);
                throw err;
            }
        }

        async function  status_refreshData(){
            try {
                    console.info("------------------- [GTB] -------------------");
                    const api = ApiHelpers.getApi();
                    const raw_devices = await api.api.call("Get", {
                        typeName: "DeviceStatusInfo"
                    });
                    for (const device of raw_devices) {
                        devices[device.device.id] = {
                            bearing : device.bearing,
                            datetime : device.dateTime,
                            communicates : device.IsDeviceCommunicating
                        };
                    }
                    console.info(devices);
                    GTB_STATUSINFO = devices;
                } catch (err) {
                    console.error("[GTB] Error:", err);
                }
        }

        async function srf_getDevicesByOrgId(orgId) {
            if (!srf_token) await srf_fetchTokenFromGitHub();
            try {
                const url = `https://api-prod.surfsight.net/v2/organizations/${orgId}/devices`;

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${srf_token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    srf_isTokenValid = false;
                    console.error("[SRF] Token inválido");
                    throw new Error("TokenInvalid");
                }

                if (!response.ok) throw new Error(`Failed to fetch devices: ${response.status} ${response.statusText}`);
                const devicesData = await response.json();

                const devices = devicesData.data || (Array.isArray(devicesData) ? devicesData : []);
                return devices;
            } catch (err) {
                console.error("[SRF]", err.message);
                throw err;
            }
        }

        async function srf_checkTokenValidity() {
            try {
                await srf_fetchTokenFromGitHub();
                const testUrl = 'https://api-prod.surfsight.net/v2/organizations/test';
                const response = await fetch(testUrl, {
                    headers: {
                        'Authorization': `Bearer ${srf_token}`,
                        'Content-Type': 'application/json'
                    }
                });
                return response.status !== 401;
            } catch (e) {
                return false;
            }
        }

        function srf_scheduleTokenRetry() {
            if (srf_tokenCheckTimeoutId) clearTimeout(srf_tokenCheckTimeoutId);

            const delay = srf_tokenRetryDelays[Math.min(srf_tokenRetryIndex, srf_tokenRetryDelays.length - 1)];
            const delayMin = delay / 60000;
            console.log(`[SRF] Reintentando token en ${delayMin}m...`);

            srf_tokenCheckTimeoutId = setTimeout(async () => {
                const isValid = await srf_checkTokenValidity();
                if (isValid) {
                    srf_isTokenValid = true;
                    srf_tokenRetryIndex = 0;
                    console.log("[SRF] Token válido nuevamente");
                    if (elt && elt.querySelector("#srf-status")) {
                        elt.querySelector("#srf-status").textContent = "Inicializando...";
                        elt.querySelector("#srf-status").classList.remove("srf-error");
                    }
                    ApiHelpers.getSessionPromise().then(async () => {
                        try {
                            const orgIdsData = await srf_getOrgIdsFromGeotab();
                            loadAndDisplay(orgIdsData);
                        } catch (err) {
                            console.error("[SRF]", err.message);
                        }
                    });
                } else {
                    srf_tokenRetryIndex++;
                    srf_scheduleTokenRetry();
                }
            }, delay);
        }

        async function srf_getSurfsightDevices(orgIdsData) {
            try {
                const devicePromises = orgIdsData.orgIdsFromCsv.map(orgId => srf_getDevicesByOrgId(orgId));
                const allDevicesArrays = await Promise.all(devicePromises);
                const allDevices = allDevicesArrays.flat();
                return allDevices;
            } catch (err) {
                console.error("[ERR] In getSurfsightDevices:", err);
                throw err;
            }
        }

        // ====== MARKETPLACE PIPELINE ======
        let mkp_deviceMappings = [];
        let mkp_validDevices = [];
        let mkp_snMap = {};
        let mkp_allDevices = [];
        let mkp_refreshIntervalId = null;

        async function mkp_getDeviceMappings() {
            try {
                const session = await ApiHelpers.getSessionPromise();
                const response = await fetch("https://media-services.geotab.com/api/DeviceMappings", {
                    method: 'GET',
                    headers: {
                        'x-mygeotab-database': encodeURIComponent(session.database),
                        'x-mygeotab-path': session.domain,
                        'x-mygeotab-sessionid': session.sessionId,
                        'x-mygeotab-username': session.userName
                    }
                });

                if (!response.ok) throw new Error(`DeviceMappings error: ${response.status}`);

                const data = await response.json();
                const items = Array.isArray(data) ? data : (data.data || []);

                mkp_deviceMappings = items
                    .filter(item => item.associatedDeviceSerialNumber && item.partnerDeviceId)
                    .map(item => ({
                        sn: item.associatedDeviceSerialNumber,
                        imei: item.partnerDeviceId
                    }));

                return mkp_deviceMappings;
            } catch (err) {
                console.error("[ERR] mkp_getDeviceMappings:", err);
                return [];
            }
        }

        async function mkp_fetchDeviceByImei(imei) {
            try {
                const url = `https://media-services.geotab.com/api/Surfsight/OrganizationDevices/${imei}`;
                const session = await ApiHelpers.getSessionPromise();
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-mygeotab-database': encodeURIComponent(session.database),
                        'x-mygeotab-path': session.domain,
                        'x-mygeotab-sessionid': session.sessionId,
                        'x-mygeotab-username': session.userName
                    }
                });

                if (!response.ok) {
                    return null;
                }

                const data = await response.json();
                return data;
            } catch (err) {
                console.error(`[MKP] fetchMarketplaceDeviceByImei failed:`, err.message);
                return null;
            }
        }

        async function mkp_refreshData() {
            if (mkp_validDevices.length === 0) return;
            const results = await Promise.all(
                mkp_validDevices.map(device =>
                    mkp_fetchDeviceByImei(device.imei).then(data => ({
                        sn: device.sn,
                        imei: device.imei,
                        data
                    }))
                )
            );
            mkp_allDevices = results.filter(r => r.data).map(r => ({
                sn: r.sn,
                imei: r.imei,
                name: r.data.deviceModel || `MKP-${r.imei}`,
                lat: r.data.lat,
                lon: r.data.lon,
                speed: Math.round(r.data.speed),
                status: r.data.status,
                lastSeenOnline: r.data.lastSeenOnline
            }));
            console.log(`[MKP] Refresh: ${mkp_allDevices.length}/${results.length} OK`);
            return mkp_allDevices;
        }

        async function mkp_initValidDevices() {
            if (mkp_deviceMappings.length === 0) return;
            const results = await Promise.all(
                mkp_deviceMappings.map(mapping =>
                    mkp_fetchDeviceByImei(mapping.imei).then(data => ({
                        sn: mapping.sn,
                        imei: mapping.imei,
                        data
                    }))
                )
            );
            mkp_validDevices = results.filter(r => r.data).map(r => ({ sn: r.sn, imei: r.imei }));
            mkp_snMap = {};
            mkp_validDevices.forEach(device => {
                mkp_snMap[device.imei] = device.sn;
            });
            mkp_allDevices = results.filter(r => r.data).map(r => ({
                sn: r.sn,
                imei: r.imei,
                name: r.data.deviceModel || `MKP-${r.imei}`,
                lat: r.data.lat,
                lon: r.data.lon,
                speed: Math.round(r.data.speed),
                status: r.data.status,
                lastSeenOnline: r.data.lastSeenOnline
            }));
            return results;
        }

        async function mkp_testRequest() {
            try {
                const session = await ApiHelpers.getSessionPromise();
                const deviceMappingsUrl = "https://media-services.geotab.com/api/DeviceMappings";

                const response = await fetch(deviceMappingsUrl, {
                    method: 'GET',
                    headers: {
                        'x-mygeotab-database': encodeURIComponent(session.database),
                        'x-mygeotab-path': session.domain,
                        'x-mygeotab-sessionid': session.sessionId,
                        'x-mygeotab-username': session.userName
                    }
                });

                const data = await response.json();
                console.log("[TEST] DeviceMappings response:", data);
                return { success: true, data };
            } catch (err) {
                console.error("[TEST] ERROR:", err.message);
                return { success: false, error: err.message };
            }
        }

        geotab.addin.srfPositions = function (elt, service) {
            ApiHelpers.init(service);
            let circles = [];
            let allDevices = [];
            let currentFilter = 'all';
            let currentSearch = '';

            const statusMap = {
                'offline': 'Sin comunicación',
                'online': 'Comunicando',
                'standby': 'En espera'
            };

            function formatDeviceDate(dateString) {
                if (!dateString) return 'N/A';
                try {
                    const date = new Date(dateString);
                    if (isNaN(date.getTime())) return 'N/A';
                    const formatter = new Intl.DateTimeFormat('es-AR', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false,
                        timeZone: 'America/Argentina/Buenos_Aires'
                    });
                    return formatter.format(date);
                } catch (e) {
                    return 'N/A';
                }
            }

            function getStatusDisplay(status) {
                return statusMap[status] || status;
            }

            function drawDevices(devices) {
                clearDevices();

                if (!Array.isArray(devices) || devices.length === 0) {
                    return;
                }

                devices.forEach(device => {
                    if (!device.lat || !device.lon) {
                        return;
                    }

                    const isOnline = device.status === 'online';
                    const isMoving = device.speed && device.speed > 0;

                    let fillColor, strokeColor;
                    if (!isOnline) {
                        fillColor = "#999999";
                        strokeColor = "#333333";
                    } else if (isMoving) {
                        fillColor = "#00cc00";
                        strokeColor = "#009900";
                    } else {
                        fillColor = "#ffcc00";
                        strokeColor = "#ff9900";
                    }

                    const circle = service.canvas.circle({ lat: device.lat, lng: device.lon }, 12, 10)
                        .change({
                            "fill": fillColor,
                            "fill-opacity": 0.8,
                            "stroke": strokeColor,
                            "stroke-width": 2
                        })
                        .attach("over", function (coords) {
                            const speed = device.speed ? Math.ceil(device.speed) : '0';
                            service.tooltip.showAt(
                                coords,
                                {
                                    main: device.name,
                                    secondary: [
                                        getStatusDisplay(device.status),
                                        formatDeviceDate(device.lastSeenOnline),
                                        speed + " km/h"
                                    ]
                                },
                                1
                            );
                        })
                        .attach("out", function () {
                            service.tooltip.hide();
                        });

                    circles.push(circle);
                });
            }

            function clearDevices() {
                circles.forEach(circle => circle.remove());
                circles = [];
            }

            function groupDevicesByStatus(devices) {
                const groups = {
                    'online': [],
                    'standby': [],
                    'offline': []
                };

                devices.forEach(device => {
                    if (groups[device.status]) {
                        groups[device.status].push(device);
                    }
                });

                return groups;
            }

            function filterDevices(devices) {
                let filtered = devices;

                if (currentFilter !== 'all') {
                    filtered = filtered.filter(d => d.status === currentFilter);
                }

                if (currentSearch.trim()) {
                    const search = currentSearch.trim().toLowerCase();
                    filtered = filtered.filter(d => d.name.toLowerCase().includes(search));
                }

                return filtered;
            }

            function renderDevicesList(devices) {
                const container = elt.querySelector("#srf-devices-container");
                const filtered = filterDevices(devices);
                const grouped = groupDevicesByStatus(filtered);

                container.innerHTML = '';

                if (filtered.length === 0) {
                    container.innerHTML = '<div style="padding:16px; text-align:center; color:#999; font-size:12px;">No hay dispositivos</div>';
                    return;
                }

                ['online', 'standby', 'offline'].forEach(status => {
                    const devicesInGroup = grouped[status];
                    if (devicesInGroup.length === 0) return;

                    const groupTitle = document.createElement('div');
                    groupTitle.style.fontWeight = '700';
                    groupTitle.style.fontSize = '11px';
                    groupTitle.style.color = '#6b7280';
                    groupTitle.style.textTransform = 'uppercase';
                    groupTitle.style.padding = '10px 12px';
                    groupTitle.style.background = '#f3f4f6';
                    groupTitle.style.borderLeft = '3px solid #3b82f6';
                    groupTitle.style.marginBottom = '10px';
                    groupTitle.style.cursor = 'pointer';
                    groupTitle.style.userSelect = 'none';
                    groupTitle.style.letterSpacing = '0.5px';
                    groupTitle.textContent = `${getStatusDisplay(status)} (${devicesInGroup.length})`;
                    container.appendChild(groupTitle);

                    devicesInGroup.forEach(device => {
                        const row = document.createElement('div');
                        row.style.padding = '12px';
                        row.style.background = 'white';
                        row.style.border = '1px solid #e5e7eb';
                        row.style.borderRadius = '6px';
                        row.style.marginBottom = '8px';
                        row.style.cursor = 'pointer';
                        row.style.transition = 'all 0.2s';

                        const speed = device.speed ? Math.ceil(device.speed) : '0';
                        const dateFormatted = formatDeviceDate(device.lastSeenOnline);

                        let badgeStyle = '';
                        if (device.status === 'online') {
                            badgeStyle = 'background:#d1fae5; color:#065f46;';
                        } else if (device.status === 'offline') {
                            badgeStyle = 'background:#f3f4f6; color:#6b7280;';
                        } else if (device.status === 'standby') {
                            badgeStyle = 'background:#fef08a; color:#854d0e;';
                        }

                        const locationStatus = (device.lat && device.lon) ? '✓ Ubicación disponible' : '✗ Ubicación no disponible';
                        const locationStyle = (device.lat && device.lon) ? 'color:#065f46;' : 'color:#dc2626;';

                        row.innerHTML = `
                            <div style="font-weight:700; font-size:14px; color:#1f2937; margin-bottom:8px; letter-spacing:-0.3px;">${device.name}</div>
                            <div style="font-size:12px; color:#6b7280; line-height:1.6;">
                                <span style="display:inline-block; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:600; margin-right:6px; letter-spacing:0.3px; ${badgeStyle}">${getStatusDisplay(device.status)}</span><br>
                                <strong style="color:#374151; font-weight:600;">Última comunicación:</strong> ${dateFormatted}<br>
                                <strong style="color:#374151; font-weight:600;">Velocidad:</strong> ${speed} km/h<br>
                                <span style="font-size:11px; ${locationStyle}">${locationStatus}</span>
                            </div>
                        `;

                        row.addEventListener('mouseenter', () => {
                            row.style.background = '#f0f4ff';
                            row.style.borderColor = '#3b82f6';
                            row.style.boxShadow = '0 2px 8px rgba(59, 130, 246, 0.12)';
                        });

                        row.addEventListener('mouseleave', () => {
                            if (!row.style.background.includes('fef3c7')) {
                                row.style.background = 'white';
                                row.style.borderColor = '#e5e7eb';
                                row.style.boxShadow = 'none';
                            }
                        });

                        const hasLocation = device.lat && device.lon;
                        row.style.cursor = hasLocation ? 'pointer' : 'not-allowed';
                        row.style.opacity = '1';

                        if (hasLocation) {
                            row.addEventListener('click', async () => {
                                const lat = parseFloat(device.lat);
                                const lng = parseFloat(device.lon);

                                try {
                                    const map = service.map;
                                    const padding = 0.02;
                                    const bounds = {
                                        sw: { lat: lat - padding, lng: lng - padding },
                                        ne: { lat: lat + padding, lng: lng + padding }
                                    };
                                    await map.setBounds(bounds);
                                } catch (e) {
                                    console.error("[ERR] Error al centrar mapa:", e);
                                }

                                row.style.background = '#fef3c7';
                                row.style.borderColor = '#fbbf24';
                                row.style.boxShadow = '0 2px 8px rgba(251, 191, 36, 0.2)';
                                setTimeout(() => {
                                    row.style.background = 'white';
                                    row.style.borderColor = '#e5e7eb';
                                    row.style.boxShadow = 'none';
                                }, 1500);
                            });
                        } else {
                            row.style.opacity = '0.6';
                            row.addEventListener('click', (e) => {
                                e.stopPropagation();
                            });
                        }

                        container.appendChild(row);
                    });
                });
            }

            function setupEventListeners() {
                const searchInput = elt.querySelector("#srf-search");
                const filterBtns = elt.querySelectorAll("[data-filter]");
                const testBtn = elt.querySelector("#srf-test-btn");

                searchInput.addEventListener('input', (e) => {
                    currentSearch = e.target.value;
                    renderDevicesList(allDevices);
                });

                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        filterBtns.forEach(b => {
                            b.style.background = 'white';
                            b.style.color = '#6b7280';
                            b.style.borderColor = '#d1d5db';
                        });
                        btn.style.background = '#3b82f6';
                        btn.style.color = 'white';
                        btn.style.borderColor = '#3b82f6';
                        currentFilter = btn.dataset.filter;
                        renderDevicesList(allDevices);
                    });
                });

                searchInput.addEventListener('focus', () => {
                    searchInput.style.outline = 'none';
                    searchInput.style.borderColor = '#3b82f6';
                    searchInput.style.boxShadow = '0 0 0 3px rgba(59, 130, 246, 0.1)';
                });

                searchInput.addEventListener('blur', () => {
                    searchInput.style.borderColor = '#d1d5db';
                    searchInput.style.boxShadow = 'none';
                });

                testBtn.addEventListener('click', async () => {
                    testBtn.disabled = true;
                    testBtn.style.opacity = '0.6';
                    testBtn.textContent = '⏳ Probando...';
                    console.log("[TEST] ========== INICIANDO PRUEBA ==========");
                    const result = await mkp_testRequest();
                    console.log("[TEST] ========== PRUEBA FINALIZADA ==========");
                    testBtn.disabled = false;
                    testBtn.style.opacity = '1';
                    testBtn.textContent = result.success ? '✓ 🧪 Probar DeviceMappings' : '✗ 🧪 Probar DeviceMappings';
                    setTimeout(() => {
                        testBtn.textContent = '🧪 Probar DeviceMappings';
                    }, 3000);
                });
            }

            async function loadAndDisplay(orgIdsData) {
                const statusEl = elt.querySelector("#srf-status");
                const countEl = elt.querySelector("#srf-device-count");
                try {
                    if (!srf_isTokenValid) {
                        statusEl.textContent = "⚠ Token SRF inválido - mostrando MKP";
                        statusEl.classList.add("srf-error");
                        if (!srf_tokenCheckTimeoutId) {
                            srf_scheduleTokenRetry();
                        }
                        // Intentar mostrar dispositivos MKP aunque SRF falle
                        if (mkp_allDevices.length > 0) {
                            drawDevices(mkp_allDevices);
                            renderDevicesList(mkp_allDevices);
                            const timeStr = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
                            statusEl.textContent = `✓ ${mkp_allDevices.length} MKP (sin SRF) a las ${timeStr}`;
                            statusEl.classList.remove("srf-error");
                            countEl.textContent = mkp_allDevices.length;
                        }
                        return;
                    }

                    statusEl.textContent = "Cargando dispositivos...";
                    let srf_devices = [];
                    try {
                        srf_devices = await srf_getSurfsightDevices(orgIdsData);
                        srf_devices = srf_devices.map(device => {
                            if (device.imei && mkp_snMap[device.imei]) {
                                device.sn = mkp_snMap[device.imei];
                            }
                            return device;
                        });
                        console.log(`[SRF] Refresh: ${srf_devices.length}/${srf_devices.length} OK`);
                    } catch (err) {
                        console.log("[SRF] No devices available, showing MKP only");
                        srf_devices = [];
                    }

                    const srf_imeiSet = new Set(srf_devices.map(d => d.imei).filter(Boolean));
                    const mkp_onlyDevices = mkp_allDevices.filter(d => !srf_imeiSet.has(d.imei));
                    const combinedDevices = [...srf_devices, ...mkp_onlyDevices];

//--------------------------------------------------- JM ----------------------------------------------------------------
                    console.info("[GTB] Assigning GTB IDs to devices...");
                    if (!gtbIdsAssigned) {
                        console.info(GTB_DEVICES);
                        console.info(GTB_STATUSINFO);
                        const gtbDeviceMap = new Map(
                            GTB_DEVICES
                                .filter(d => d.serialNumber)
                                .map(d => [d.serialNumber, d.id])
                        );
                        combinedDevices.forEach(device => {
                            device.gtbId = gtbDeviceMap.get(device.sn) ?? null;
                        });
                        gtbIdsAssigned = true;
                    }
                    const communicatingIds = new Set(
                        GTB_STATUSINFO
                            .filter(s => s.communicates)
                            .map(s => s.id)
                    );
                    const visibleDevices = combinedDevices.filter(d =>
                        communicatingIds.has(d.gtbId)
                    );
                    combinedDevices = visibleDevices;
//--------------------------------------------------- JM ----------------------------------------------------------------

                    if (combinedDevices.length === 0) {
                        statusEl.textContent = "✗ No hay dispositivos disponibles";
                        statusEl.classList.add("srf-error");
                        return;
                    }
                    drawDevices(combinedDevices);
                    renderDevicesList(combinedDevices);
                    const timeStr = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
                    const srf_count = srf_devices.length;
                    const mkp_count = mkp_onlyDevices.length;
                    const label = srf_count > 0 && mkp_count > 0 ? `${combinedDevices.length} (${srf_count} SRF, ${mkp_count} MKP)` :
                                  mkp_count > 0 ? `${mkp_count} MKP` :
                                  `${srf_count} SRF`;
                    statusEl.textContent = `✓ ${label} a las ${timeStr}`;
                    statusEl.classList.remove("srf-error");
                    countEl.textContent = combinedDevices.length;
                } catch (err) {
                    console.error("[ERR]", err);
                    if (err.message === "TokenInvalid") {
                        srf_isTokenValid = false;
                        statusEl.textContent = "⚠ Token SRF inválido - mostrando MKP";
                        statusEl.classList.add("srf-error");
                        if (!srf_tokenCheckTimeoutId) {
                            srf_scheduleTokenRetry();
                        }
                        // Mostrar MKP como fallback
                        if (mkp_allDevices.length > 0) {
                            drawDevices(mkp_allDevices);
                            renderDevicesList(mkp_allDevices);
                            const timeStr = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
                            statusEl.textContent = `✓ ${mkp_allDevices.length} MKP (sin SRF) a las ${timeStr}`;
                            statusEl.classList.remove("srf-error");
                            countEl.textContent = mkp_allDevices.length;
                        }
                    } else {
                        statusEl.textContent = `✗ ${err.message}`;
                        statusEl.classList.add("srf-error");
                    }
                }
            }

            elt.style.width = '100%';
            elt.style.height = '100%';
            elt.style.overflow = 'hidden';
            elt.innerHTML = `
                <div style="display:flex; height:100%; width:100%; font-family:'Segoe UI',Roboto,Arial,sans-serif; color:#333; background:#ffffff;">
                  <div id="srf-panel" style="width:430px; height:800px; background:#ffffff; border-right:1px solid #e5e7eb; display:flex; flex-direction:column; box-shadow:2px 0 8px rgba(0,0,0,0.08);">
                    <div id="srf-header" style="padding:20px; border-bottom:1px solid #e5e7eb; background:#f9fafb;">
                      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <h3 style="font-size:18px; font-weight:700; color:#1f2937; letter-spacing:-0.5px; margin:0;">SRF Positions</h3>
                        <span id="srf-device-count" style="font-size:11px; font-weight:600; color:#6b7280; background:#e5e7eb; padding:4px 8px; border-radius:4px;">0</span>
                      </div>
                      <input type="text" id="srf-search" placeholder="Buscar por nombre..." style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; margin-bottom:12px; background:white; color:#1f2937; box-sizing:border-box;">
                      <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button class="srf-filter-btn-all" data-filter="all" style="flex:1; min-width:70px; padding:8px 12px; border:1px solid #d1d5db; background:#3b82f6; color:white; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s; border-color:#3b82f6;">Todos</button>
                        <button class="srf-filter-btn-other" data-filter="online" style="flex:1; min-width:70px; padding:8px 12px; border:1px solid #d1d5db; background:white; color:#6b7280; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s;">En línea</button>
                        <button class="srf-filter-btn-other" data-filter="standby" style="flex:1; min-width:70px; padding:8px 12px; border:1px solid #d1d5db; background:white; color:#6b7280; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s;">En espera</button>
                        <button class="srf-filter-btn-other" data-filter="offline" style="flex:1; min-width:70px; padding:8px 12px; border:1px solid #d1d5db; background:white; color:#6b7280; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s;">Offline</button>
                      </div>
                      <button id="srf-test-btn" style="width:100%; margin-top:12px; padding:8px 12px; border:1px solid #d1d5db; background:#8b5cf6; color:white; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s; border-color:#8b5cf6;">🧪 Probar DeviceMappings</button>
                    </div>
                    <div id="srf-devices-container" style="height:565px; overflow-y:scroll; overflow-x:hidden; padding:12px; -webkit-overflow-scrolling:touch;"></div>
                    <div id="srf-footer" style="padding:8px 12px; border-top:1px solid #e5e7eb; background:#f9fafb;">
                      <div id="srf-status" style="padding:12px 12px; background:#ecfdf5; color:#065f46; border-radius:6px; font-size:12px; text-align:center; border:1px solid #a7f3d0; font-weight:500;">Inicializando...</div>
                    </div>
                  </div>
                  <div id="srf-map" style="flex:1; background:white;"></div>
                </div>
            `;

            ApiHelpers.getSessionPromise().then(async () => {
                setupEventListeners();

                // SURFSIGHT PIPELINE
                (async () => {
                    let orgIdsData = null;
                    try {
                        await srf_fetchTokenFromGitHub();
                        orgIdsData = await srf_getOrgIdsFromGeotab();

                        loadAndDisplay(orgIdsData);
                        srf_regularRefreshIntervalId = setInterval(() => {
                            if (srf_isTokenValid && orgIdsData) {
                                loadAndDisplay(orgIdsData);
                            }
                        }, 10000);
                    } catch (err) {
                        console.error("[SRF] Initialization:", err.message);
                        const statusEl = elt.querySelector("#srf-status");
                        if (err.message.includes("No matching OrgIds found")) {
                            statusEl.textContent = "Sin SRF Id para esta organización";
                        } else {
                            statusEl.textContent = "Error en SRF - intentando MKP...";
                        }
                        statusEl.classList.add("srf-error");

                        // Esperar a que MKP termine de inicializarse antes de mostrar fallback
                        try {
                            await mkp_initPromise;
                            if (mkp_allDevices.length > 0) {
                                drawDevices(mkp_allDevices);
                                renderDevicesList(mkp_allDevices);
                                const timeStr = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
                                statusEl.textContent = `✓ ${mkp_allDevices.length} MKP a las ${timeStr}`;
                                statusEl.classList.remove("srf-error");
                                elt.querySelector("#srf-device-count").textContent = mkp_allDevices.length;
                            }
                        } catch (mkpErr) {
                            console.error("[MKP] Fallback:", mkpErr.message);
                        }
                    }
                })();

                // MARKETPLACE PIPELINE
                mkp_initPromise = (async () => {
                    try {
                        await mkp_getDeviceMappings();
                        await mkp_initValidDevices();
                        mkp_refreshIntervalId = setInterval(() => {
                            mkp_refreshData();
                        }, 30000);
                    } catch (err) {
                        console.error("[MKP] Initialization failed:", err);
                    }
                })();

                // StatusInfo PIPELINE
                status_initPromise = (async () => {
                    try {
                        status_refreshIntervalId = setInterval(() => {
                            status_refreshData();
                        }, 10000);
                    } catch (err) {
                        console.error("[StatusInfo] Initialization failed:", err);
                    }
                })();

            }).catch(err => {
                console.error("[Session]", err.message);
                elt.querySelector("#srf-status").textContent = "✗ Error loading session";
            });
        };

        getLastCommitMessage().then(() => {
            console.log("[APP] Script loaded");
        });
    </script>
</body>
</html>
