                    <div class="mon-tiles">
                        ${tile(st.carreteos.length, 'Carreteos', `prom. ${fmt(promedio(st.carreteos.map(c => c.dur)))}`)}
                        ${tile(Math.round(kmTotal), 'km carreteados', st.carreteos.length ? `prom. ${(kmTotal / st.carreteos.length).toFixed(1)} km` : '')}
                        ${tile(fmt(promedio(st.esperas)), 'Espera promedio', `${st.esperas.length} con espera`)}
                    </div>

                    <div class="mon-sec">Demoras (hasta ${DEMORA_STANDBY_SEG / 3600} h)</div>
                    <div class="mon-tiles">
                        ${tile(st.demoras.length, 'Demoras', `${st.demoras.filter(d => d.abierta).length} en curso`, 'warn')}
                        ${tile(fmt(promedio(durDem)), 'Demora promedio', `máx. ${fmt(maximo(durDem))}`, 'warn')}
                        ${tile(fmt(durDem.reduce((s, x) => s + x, 0) || null), 'Tiempo total', 'en demora', 'warn')}
                    </div>

                    <div class="mon-sec">StandBy (más de ${DEMORA_STANDBY_SEG / 3600} h)</div>
                    <div class="mon-tiles">
                        ${tile(st.standbys.length, 'StandBy', `${st.standbys.filter(d => d.abierta).length} en curso`, 'crit')}
                        ${tile(fmt(promedio(durSb)), 'StandBy promedio', `máx. ${fmt(maximo(durSb))}`, 'crit')}
                        ${tile(fmt(durSb.reduce((s, x) => s + x, 0) || null), 'Tiempo total', 'en StandBy', 'crit')}
                    </div>

                    <div class="mon-sec">Estado actual de la flota</div>
                    ${barrasH(filasEstado)}
                    ${sinComunicar ? `<div class="mon-note">${sinComunicar} GO sin comunicar</div>` : ''}

                    <div class="mon-sec">Operativos por hora</div>
                    ${barrasHora(st.porHora)}

                    <div class="mon-sec">Geocercas con mayor espera promedio</div>
                    ${barrasH(filasEspera, 'var(--warn)')}

                    <div class="mon-sec">Geocercas más visitadas</div>
                    ${barrasH(filasVisitas, 'var(--neon)')}

                    <div class="mon-sec">Unidades con más tiempo en Demora</div>
                    ${barrasH(filasDemUnidad, ESTADOS["Demora"].color)}

                    <div class="mon-sec">Unidades con más tiempo en StandBy</div>
                    ${barrasH(filasSbUnidad, ESTADOS["StandBy"].color)}

                    <div class="mon-sec">Carreteos en curso más largos</div>
                    ${barrasH(filasCarreteo, ESTADOS["Carreteo"].color)}

                    <div class="mon-sec">Visitas de control</div>
                    <div class="mon-tiles mon-tiles-4">
                        ${controles.map(c => tile(st.control[c] || 0, c === 'Estacion de Servicio' ? 'Estación' : c)).join('')}
                    </div>
                `;
            }

            function toggleDashboard() {
                dashVisible = !dashVisible;
                elt.querySelector("#mon-root").classList.toggle('mon-modo-dash', dashVisible);
                elt.querySelector("#mon-dash-btn").innerHTML = dashVisible ? btnHtml(ICO.list, 'Lista') : btnHtml(ICO.dash, 'Dashboard');
                if (dashVisible) { dash_prev = {}; renderDashboard(); }
                else { lista_animarEntrada = true; renderLista(vehiculos); }
            }

            function renderContadores(todos) {
                const lista = filtrarBusqueda(todos);
                elt.querySelectorAll("[data-filter]").forEach(btn => {
                    const cat = btn.dataset.filter;
                    const n = cat === 'all' ? lista.length
                        : lista.filter(v => (ESTADOS[v.estado] || ESTADOS["Sin clasificar"]).cat === cat).length;
                    btn.querySelector('.mon-count').textContent = n;
                });
                const standby = lista.filter(v => v.estado === 'StandBy').length;
                const demoras = lista.filter(v => v.estado === 'Demora').length;
                const alertas = [];
                if (standby > 0) alertas.push(`${standby} en StandBy (> ${DEMORA_STANDBY_SEG / 3600} h detenido)`);
                if (demoras > 0) alertas.push(`${demoras} en Demora`);
                elt.querySelector("#mon-alerts").textContent = alertas.length ? alertas.join(' · ') : '';
            }

            let filtro_errorLogueado = false;

            async function filtro_leer() {
                try {
                    return filtro_aplicar(await service.page.getFilterState());
                } catch (err) {
                    if (!filtro_errorLogueado) console.error("[FILTRO] No se pudo leer el filtro de grupos:", err);
                    filtro_errorLogueado = true;
                    return false;
                }
            }

            // ─────────────────────────────────────────────────────────────────
            //  FILTRO BIDIRECCIONAL CON EL MAPA (vehículos visibles)
            // ─────────────────────────────────────────────────────────────────
            // La selección de vehículos del mapa vive en el estado de la página (page.get/set,
            // clave liveVehicleIds, la misma que aparece en la URL del mapa).
            //   Add-in -> mapa: con un filtro de tramo o una búsqueda activos, el mapa muestra
            //     solo esas unidades; al volver a "Todos" se restaura la selección del usuario.
            //   Mapa -> add-in: si el usuario elige activos en el mapa, el add-in se limita a esos.
            // Lo que pone el add-in vuelve como stateChange: se reconoce por su firma y se ignora.
            const MAPA_CLAVE = "liveVehicleIds";
            const SYNC_STORAGE_KEY = "monitorSupe.syncMapa";
            let syncMapa = true;
            try { syncMapa = localStorage.getItem(SYNC_STORAGE_KEY) !== "0"; } catch (e) { /* sin storage */ }
            let mapa_original;              // selección del usuario antes de filtrar (undefined = el add-in no tocó el mapa)
            let mapa_firmaPropia = null;    // firma de lo último que puso el add-in
            let mapa_errorLogueado = false;

            // Ids de la selección del mapa: null = todos (sin selección o "all")
            function mapa_ids(valor) {
                if (valor == null || valor === '') return null;
                if (typeof valor === 'string') {
                    if (/^all$/i.test(valor.trim())) return null;
                    return valor.match(/b[0-9A-Za-z]+/g) || [];
                }
                const ids = filtro_extraerIds(valor);
                return Array.isArray(valor) || ids.length ? ids : null;
            }
            const mapa_firma = ids => ids == null ? 'ALL' : ids.slice().sort().join(',');

            // Selección del usuario en el mapa -> filtro del add-in
            function mapa_adoptarSeleccion(valor) {
                const ids = mapa_ids(valor);
                FILTRO_ACTIVOS = ids ? new Set(ids) : null;
                FILTRO_ACTIVOS_N = ids ? ids.length : 0;
            }

            async function mapa_set(valor, firma) {
                mapa_firmaPropia = firma;
                try {
                    await service.page.set(MAPA_CLAVE, valor);
                } catch (err) {
                    if (!mapa_errorLogueado) console.error("[MAPA] No se pudo filtrar los vehículos del mapa:", err);
                    mapa_errorLogueado = true;
                }
            }

            // Vuelve a la selección que tenía el usuario antes de que el add-in filtrara
            async function mapa_restaurar() {
                if (mapa_original === undefined) return;
                const orig = mapa_original;
                mapa_original = undefined;
                await mapa_set(orig == null ? "all" : orig, mapa_firma(mapa_ids(orig)));
            }

            // Add-in -> mapa. Se llama en cada render: solo escribe si cambió el conjunto de unidades.
            async function mapa_aplicar() {
                if (!service.page || typeof service.page.set !== 'function') return;
                const filtrando = syncMapa && service.page.active !== false
                    && (currentFilter !== 'all' || currentSearch.trim() !== '');
                if (!filtrando) return mapa_restaurar();
                const ids = filtrar(vehiculos).map(v => v.id);
                const firma = mapa_firma(ids);
                if (mapa_original !== undefined && firma === mapa_firmaPropia) return;
                if (mapa_original === undefined) {
                    try {
                        const st = await service.page.get();
                        mapa_original = st && st[MAPA_CLAVE] !== undefined ? st[MAPA_CLAVE] : null;
                    } catch (err) {
                        mapa_original = null;
                    }
                }
                await mapa_set(ids, firma);
            }

            // Mapa -> add-in: cambios de la selección de vehículos hechos por el usuario
            function mapa_alCambiarEstado(data) {
                const st = data && data.state !== undefined ? data.state : data;
                if (!st || st[MAPA_CLAVE] === undefined) return;
                const valor = st[MAPA_CLAVE];
                if (mapa_firma(mapa_ids(valor)) === mapa_firmaPropia) return;   // eco de lo que puso el add-in
                // El usuario cambió la selección en el mapa: manda el mapa. El add-in deja su
                // filtro de tramo para no pisarla y pasa a mostrar las unidades elegidas.
                dbg("[MAPA] Selección del usuario:", valor);
                mapa_firmaPropia = null;
                mapa_original = undefined;
                mapa_adoptarSeleccion(valor);
                if (currentFilter !== 'all' || currentSearch) {
                    currentFilter = 'all';
                    currentSearch = '';
                    elt.querySelector("#mon-search").value = '';
                    elt.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
                }
                lista_animarEntrada = true;
                renderAll();
            }

            async function mapa_iniciar() {
                try {
                    const st = await service.page.get();
                    initLog("[MAPA] Estado de la página:", st);
                    if (st && st[MAPA_CLAVE] !== undefined) mapa_adoptarSeleccion(st[MAPA_CLAVE]);
                } catch (err) {
                    console.error("[MAPA] No se pudo leer el estado de la página:", err);
                }
                try {
                    service.page.attach("stateChange", mapa_alCambiarEstado);
                    // Al pasar a otra pestaña de add-in se devuelve el mapa como estaba; al volver, se reaplica
                    service.page.attach("blur", () => { mapa_restaurar(); });
                    service.page.attach("focus", () => { mapa_aplicar(); });
                } catch (err) {
                    console.error("[MAPA] No se pudo escuchar el estado de la página:", err);
                }
            }

            // Desde la UI (tipeo en la búsqueda, clicks seguidos en filtros): una sola escritura al final
            let mapa_timer = null;
            function mapa_aplicarPronto() {
                clearTimeout(mapa_timer);
                mapa_timer = setTimeout(mapa_aplicar, 350);
            }

            function toggleSyncMapa(on) {
                syncMapa = on;
                try { localStorage.setItem(SYNC_STORAGE_KEY, on ? "1" : "0"); } catch (e) { /* sin storage */ }
                mapa_aplicar();
            }

            async function renderAll() {
                const statusEl = elt.querySelector("#mon-status");
                try {
                    await filtro_leer();
                    await actualizarEstados();
                    dibujarSeleccion();
                    renderLista(vehiculos);
                    renderContadores(vehiculos);
                    dibujarEtiquetas();
                    mapa_aplicar();
                    const timeStr = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
                    const partes = [];
                    if (FILTRO_GRUPOS) partes.push(`${FILTRO_GRUPOS_N} grupo${FILTRO_GRUPOS_N === 1 ? '' : 's'}`);
                    if (FILTRO_ACTIVOS) partes.push(`${FILTRO_ACTIVOS_N} activo${FILTRO_ACTIVOS_N === 1 ? '' : 's'} del mapa`);
                    const filtro = partes.length ? ` (filtro: ${partes.join(' · ')})` : '';
                    statusEl.textContent = `${vehiculos.length} vehículos afectados${filtro} · actualizado ${timeStr}`;
                    if (dashVisible) await renderDashboard();
                    statusEl.classList.remove("mon-error");
                    return true;
                } catch (err) {
                    console.error("[RENDER]", err);
                    statusEl.textContent = err.message;
                    statusEl.classList.add("mon-error");
                    return false;
                }
            }

            // Botón Actualizar: estado visible mientras trae datos y el resultado al terminar
            let actualizando = false;
            async function actualizarAhora() {
                const btn = elt.querySelector("#mon-refresh");
                const statusEl = elt.querySelector("#mon-status");
                if (actualizando) return;
                actualizando = true;
                btn.disabled = true;
                btn.classList.add('mon-btn-busy');
                btn.innerHTML = btnHtml(ICO.refresh, 'Actualizando');
                statusEl.textContent = 'Actualizando datos...';
                setCargando(true);
                statusEl.classList.remove("mon-error");

                const [okStatus, okEventos] = await Promise.all([status_refreshData(), ev_refreshData()]);
                const okRender = await renderAll();
                const ok = okStatus && okEventos && okRender;
                setCargando(false);

                if (!ok) {
                    const fallas = [!okStatus && 'posiciones', !okEventos && 'eventos', !okRender && 'cálculo'].filter(Boolean);
                    statusEl.textContent = `Falló la actualización (${fallas.join(', ')}). Ver consola.`;
                    statusEl.classList.add("mon-error");
                }
                btn.innerHTML = ok ? btnHtml(ICO.ok, 'Actualizado') : btnHtml(ICO.err, 'Error');
                btn.classList.remove('mon-btn-busy');
                btn.classList.add(ok ? 'mon-btn-ok' : 'mon-btn-err');
                setTimeout(() => {
                    btn.innerHTML = btnHtml(ICO.refresh, 'Actualizar');
                    btn.classList.remove('mon-btn-ok', 'mon-btn-err');
                    btn.disabled = false;
                    actualizando = false;
                }, 2500);
            }

            function setupEventListeners() {
                elt.querySelector("#mon-search").addEventListener('input', e => {
                    currentSearch = e.target.value;
                    lista_animarEntrada = true;
                    renderLista(vehiculos);
                    renderContadores(vehiculos);
                    dibujarEtiquetas();
                    mapa_aplicarPronto();
                });
                elt.querySelectorAll("[data-filter]").forEach(btn => {
                    btn.addEventListener('click', () => {
                        elt.querySelectorAll("[data-filter]").forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = btn.dataset.filter;
                        lista_animarEntrada = true;
                        renderLista(vehiculos);
                        dibujarEtiquetas();
                        mapa_aplicarPronto();
                    });
                });
                const etqToggle = elt.querySelector("#mon-etq-toggle");
                etqToggle.checked = etiquetasVisibles;
                etqToggle.addEventListener('change', () => toggleEtiquetas(etqToggle.checked));
                const syncToggle = elt.querySelector("#mon-sync-toggle");
                syncToggle.checked = syncMapa;
                syncToggle.addEventListener('change', () => toggleSyncMapa(syncToggle.checked));
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape' && seleccionId) seleccionar({ id: seleccionId });
                });
                elt.querySelector("#mon-dash-btn").addEventListener('click', toggleDashboard);
                elt.querySelector("#mon-refresh").addEventListener('click', actualizarAhora);
            }

            // Geotab descarta el <head>: los estilos se inyectan acá, acotados a #mon-root
            const style = document.createElement('style');

                #mon-root .mon-progress::after { content:''; position:absolute; inset:0; width:33%; background:var(--neon); box-shadow:0 0 8px var(--neon); animation:mon-indet 1s var(--ease) infinite; }

                    font:600 11px var(--font); letter-spacing:.06em; text-transform:uppercase; cursor:pointer;

                #mon-root .mon-switch-track::after { content:''; position:absolute; top:2px; left:2px; width:8px; height:8px; background:var(--text-mute); transition:transform .18s var(--ease), background .18s, box-shadow .18s; }
                #mon-root .mon-switch input:checked + .mon-switch-track { border-color:var(--neon); background:color-mix(in srgb, var(--neon) 8%, transparent); }

                #mon-root #mon-search { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface-2); color:var(--text); font:13px var(--font); margin-bottom:10px; transition:border-color .18s, box-shadow .18s; }
                #mon-root #mon-search::placeholder { color:var(--text-mute); }
                #mon-root #mon-search:focus { outline:none; border-color:var(--neon); box-shadow:var(--glow); background:var(--surface); }
                #mon-root .mon-filters { display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:var(--radius); }
                #mon-root .mon-filters button { position:relative; flex:1 0 auto; padding:7px 8px 6px; border:0; border-right:1px solid var(--line); background:transparent; color:var(--text-mute);
                    font:600 10.5px var(--font); letter-spacing:.06em; text-transform:uppercase; cursor:pointer; transition:color .15s, background .15s; }
                #mon-root .mon-filters button:last-child { border-right:0; }
                #mon-root .mon-filters button::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--neon); transform:scaleX(0); transition:transform .2s var(--ease); }
                #mon-root .mon-filters button:hover { color:var(--text); background:var(--surface-2); }
                #mon-root .mon-filters button.active { color:var(--neon); background:color-mix(in srgb, var(--neon) 6%, transparent); }
                #mon-root .mon-filters button.active::after { transform:scaleX(1); box-shadow:0 0 6px var(--neon); }
                #mon-root .mon-count { font-family:var(--mono); font-weight:600; margin-left:5px; color:var(--text); }
                #mon-root #mon-alerts { margin-top:10px; padding:6px 10px; border-left:2px solid var(--crit); background:color-mix(in srgb, var(--crit) 6%, transparent); color:var(--crit); font:600 11px var(--font); letter-spacing:.04em; animation:mon-enter .22s var(--ease) both; }
                #mon-root #mon-alerts:empty { display:none; }

                /* Lista */
                #mon-root #mon-list { flex:1; min-height:0; overflow-y:auto; padding:4px 0 12px; }
                #mon-root .mon-empty { padding:20px 16px; color:var(--text-mute); font:600 11px var(--font); letter-spacing:.08em; text-transform:uppercase; }
                #mon-root .mon-group { --c:var(--neon); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:1; margin:10px 0 0; padding:7px 16px 6px 14px;
                    border-left:2px solid var(--c); border-bottom:1px solid var(--line); background:var(--surface);
                    font:700 10.5px var(--font); letter-spacing:.1em; text-transform:uppercase; color:var(--text); }
                #mon-root .mon-group b { font-family:var(--mono); color:var(--c); font-weight:600; }
                #mon-root .mon-row { --c:var(--neon); position:relative; padding:10px 16px 10px 14px; border-left:2px solid transparent; border-bottom:1px solid var(--line); background:var(--surface); cursor:pointer;
                    transition:background .15s, border-color .15s; }
                #mon-root .mon-row::after { content:''; position:absolute; left:0; bottom:-1px; height:1px; width:100%; background:var(--neon); transform:scaleX(0); transform-origin:left; transition:transform .18s var(--ease); }
                #mon-root .mon-row:hover { background:var(--surface-2); border-left-color:var(--c); }
                #mon-root .mon-row:hover::after { transform:scaleX(1); }
                #mon-root .mon-row-disabled { opacity:.55; cursor:not-allowed; }
                #mon-root .mon-row-selected, #mon-root .mon-row-selected:hover { border-left-color:var(--magenta); background:color-mix(in srgb, var(--magenta) 6%, transparent); }
                #mon-root .mon-row-focus { animation:mon-flash 1s var(--ease) 2; }
                #mon-root .mon-row-enter { animation:mon-enter .22s var(--ease) both; animation-delay:calc(var(--i, 0) * 30ms); }
                #mon-root .mon-changed { animation:mon-flash .7s var(--ease); }
                #mon-root .mon-row-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
                #mon-root .mon-name { font-weight:700; font-size:13.5px; color:var(--text); }
                #mon-root .mon-plate { font:600 11px var(--mono); color:var(--text-mute); letter-spacing:.04em; }
                #mon-root .mon-badges { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
                #mon-root .mon-tag { --c:var(--text-mute); display:inline-flex; align-items:center; gap:6px; padding:2px 7px; border:1px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius:var(--radius);
                    font:600 10.5px var(--font); letter-spacing:.05em; text-transform:uppercase; color:color-mix(in srgb, var(--c) 78%, var(--text)); background:color-mix(in srgb, var(--c) 6%, transparent); }
                #mon-root .mon-tag-estado::before { content:''; width:6px; height:6px; background:var(--c); }
                #mon-root .mon-tag-warn { --c:var(--warn); }
                #mon-root .mon-tag-info { --c:var(--neon); }
                #mon-root .mon-tag-off  { --c:var(--text-mute); }
                #mon-root .mon-kv { display:grid; grid-template-columns:92px 1fr; gap:3px 10px; font-size:12px; line-height:1.45; }
                #mon-root .mon-kv dt { font:600 9.5px/1.9 var(--font); letter-spacing:.1em; text-transform:uppercase; color:var(--text-mute); }
                #mon-root .mon-kv dd { margin:0; color:var(--text); min-width:0; overflow-wrap:anywhere; }
                #mon-root .mon-mono { font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums; }
                #mon-root .mon-mute { color:var(--text-mute); }
                #mon-root .mon-atrasado { color:var(--warn); font-weight:600; }
                #mon-root .mon-eta { color:var(--neon); font-weight:600; }

                /* Modo dashboard */
                #mon-root #mon-dash { display:none; flex:1; min-height:0; overflow-y:auto; padding:12px 16px 16px; }
                #mon-root.mon-modo-dash #mon-dash { display:block; animation:mon-view .2s var(--ease) both; }
                #mon-root #mon-list { animation:mon-view .2s var(--ease) both; }
                #mon-root.mon-modo-dash #mon-list,
                #mon-root.mon-modo-dash #mon-search,
                #mon-root.mon-modo-dash .mon-filters { display:none; }
                #mon-root .mon-dash-head { font:600 10.5px var(--font); letter-spacing:.08em; text-transform:uppercase; color:var(--text-mute); }
                #mon-root .mon-dash-head b { font-family:var(--mono); color:var(--text); }
                #mon-root .mon-sec { display:flex; align-items:center; gap:8px; font:700 10.5px var(--font); letter-spacing:.1em; text-transform:uppercase; color:var(--brand); margin:20px 0 10px; }
                #mon-root .mon-sec::after { content:''; flex:1; height:1px; background:var(--line); }
                #mon-root .mon-tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:8px; }
                #mon-root .mon-tiles-4 { grid-template-columns:repeat(auto-fit, minmax(80px, 1fr)); }
                #mon-root .mon-tile { --c:var(--neon); position:relative; background:var(--surface); padding:10px 12px; }
                #mon-root .mon-tile::before, #mon-root .mon-tile::after { content:''; position:absolute; width:8px; height:8px; border-color:var(--c); border-style:solid; opacity:.8; }
                #mon-root .mon-tile::before { top:4px; left:4px; border-width:1px 0 0 1px; }
                #mon-root .mon-tile::after { bottom:4px; right:4px; border-width:0 1px 1px 0; }
                #mon-root .mon-tile-val { font:600 24px/1.15 var(--font); font-variant-numeric:tabular-nums; color:var(--text); }
                #mon-root .mon-tile-label { margin-top:3px; font:600 9.5px var(--font); letter-spacing:.1em; text-transform:uppercase; color:var(--text-mute); }
                #mon-root .mon-tile-sub { margin-top:2px; font:10.5px var(--mono); color:var(--text-mute); }
                #mon-root .mon-tile-warn { --c:var(--warn); }
                #mon-root .mon-tile-warn .mon-tile-val { color:var(--warn); }
                #mon-root .mon-tile-crit { --c:var(--crit); }
                #mon-root .mon-tile-crit .mon-tile-val { color:var(--crit); }
                #mon-root .mon-hbar { display:grid; grid-template-columns:minmax(120px, 30%) 1fr 58px; align-items:center; gap:10px; font-size:11.5px; padding:3px 0; }
                #mon-root .mon-hbar-label { color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
                #mon-root .mon-hbar-track { position:relative; height:6px; background:var(--surface-2); border-bottom:1px solid var(--line); }
                #mon-root .mon-hbar-fill { display:block; height:100%; transition:width .55s var(--ease); }
                #mon-root .mon-hbar:hover .mon-hbar-fill { box-shadow:0 0 8px currentColor; }
                #mon-root .mon-hbar-val { text-align:right; font:600 11px var(--mono); font-variant-numeric:tabular-nums; color:var(--text); }
                #mon-root .mon-legend { display:flex; gap:14px; font:600 10px var(--font); letter-spacing:.06em; text-transform:uppercase; color:var(--text-mute); margin-bottom:8px; }
                #mon-root .mon-leg i { display:inline-block; width:8px; height:8px; margin-right:5px; vertical-align:0; }
                #mon-root .mon-vchart { display:flex; align-items:flex-end; gap:2px; height:110px; border-bottom:1px solid var(--line-2); }
                #mon-root .mon-vcol { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; position:relative; cursor:default; }
                #mon-root .mon-vcol:hover .mon-vcol-bar { filter:brightness(1.15) drop-shadow(0 0 4px var(--neon)); }
                #mon-root .mon-vcol-futuro { opacity:.3; }
                #mon-root .mon-vcol-bar { display:flex; flex-direction:column-reverse; gap:2px; height:100%; justify-content:flex-start; transform-origin:bottom; }
                #mon-root #mon-dash.mon-dash-primera .mon-vcol-bar { animation:mon-grow .55s var(--ease) both; }
                #mon-root .mon-vcol-bar span { display:block; width:100%; }
                #mon-root .mon-vcol-x { position:absolute; bottom:-16px; left:0; font:9.5px var(--mono); color:var(--text-mute); }
                #mon-root .mon-vchart + * { margin-top:22px; }
                #mon-root .mon-note { font:10.5px var(--mono); color:var(--text-mute); margin-top:4px; }

                /* Pie: el contenedor de Geotab es algo más alto que el área visible, el margen
                   inferior sube el pie para que el cartel de estado no quede cortado */
                #mon-root .mon-footer { padding:8px 16px 36px; border-top:1px solid var(--line); background:var(--surface); }
                #mon-root #mon-status { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line); border-left:2px solid var(--ok);
                    font:600 10.5px var(--font); letter-spacing:.06em; text-transform:uppercase; color:var(--text); }
                #mon-root #mon-status::before { content:''; flex:none; width:6px; height:6px; background:var(--ok); box-shadow:0 0 6px var(--ok); }
                #mon-root #mon-status.mon-error { border-left-color:var(--crit); color:var(--crit); }
                #mon-root #mon-status.mon-error::before { background:var(--crit); box-shadow:0 0 6px var(--crit); }
                #mon-root.mon-cargando #mon-status { border-left-color:var(--neon); }
                #mon-root.mon-cargando #mon-status::before { background:var(--neon); box-shadow:0 0 6px var(--neon); animation:mon-blink 1s steps(2) infinite; }

                @keyframes mon-enter { from { opacity:0; transform:translateY(6px); } }
                @keyframes mon-view  { from { opacity:0; transform:translateY(8px); } }
                @keyframes mon-flash { from { box-shadow:inset 0 0 0 1px var(--neon), 0 0 16px -2px var(--neon); } }
                @keyframes mon-ping  { from { transform:scale(1); opacity:.6; } to { transform:scale(2.6); opacity:0; } }
                @keyframes mon-indet { from { transform:translateX(-100%); } to { transform:translateX(300%); } }
                @keyframes mon-grow  { from { transform:scaleY(0); } }
                @keyframes mon-spin  { to { transform:rotate(360deg); } }
                @keyframes mon-blink { 50% { opacity:.2; } }
                @media (prefers-reduced-motion: reduce) {
                    #mon-root *, #mon-root *::before, #mon-root *::after { animation:none !important; transition:none !important; }
                }
            `;

            elt.style.width = '100%';
            elt.style.height = '100%';
            elt.style.overflow = 'hidden';
            elt.innerHTML = `
                <div id="mon-root">
                  <div class="mon-panel">
                    <div class="mon-progress"></div>
                    <div class="mon-header">
                      <div class="mon-title">
                        <h3>Monitor Cesetti</h3>
                        <div class="mon-title-btns">
                          <button id="mon-dash-btn" class="mon-btn" title="Estadísticas del día">${ICO.dash}<span>Dashboard</span></button>
                          <button id="mon-refresh" class="mon-btn mon-btn-primary" title="Actualizar ahora">${ICO.refresh}<span>Actualizar</span></button>
                        </div>
                      </div>
                      <div class="mon-subbar">
                        <div id="mon-feeds"><span class="mon-feed mon-feed-off"><i></i>Feeds: consultando...</span></div>
                        <div class="mon-toggles">
                        <label class="mon-switch" title="Mostrar el estado de cada unidad junto a su ícono en el mapa">
                          <input type="checkbox" id="mon-etq-toggle"><span class="mon-switch-track"></span>Etiquetas en mapa
                        </label>
                        <label class="mon-switch" title="Al filtrar por tramo o buscar, mostrar en el mapa solo esas unidades">
                          <input type="checkbox" id="mon-sync-toggle"><span class="mon-switch-track"></span>Filtrar mapa
                        </label>
                        </div>
                      </div>
                      <input type="text" id="mon-search" placeholder="Buscar por nombre, patente o geocerca...">
                      <div class="mon-filters">
                        ${CATEGORIAS.map(c => `<button data-filter="${c.id}" class="${c.id === 'all' ? 'active' : ''}">${c.label}<span class="mon-count">0</span></button>`).join('')}
                      </div>
                      <div id="mon-alerts"></div>
                    </div>
                    <div id="mon-list"></div>
                    <div id="mon-dash"></div>
                    <div class="mon-footer">
                      <div id="mon-status">Inicializando...</div>
                    </div>
                  </div>
                </div>
            `;
            elt.prepend(style);

            ApiHelpers.getSessionPromise().then(async session => {
                // Sin acceso: no se arranca ningún pipeline ni se dibuja nada en el mapa
                const usuario = (session.userName || "").toLowerCase().trim();
                if (!LISTA_BLANCA.includes(usuario)) {
                    elt.querySelector("#mon-root").innerHTML = `
                        <div style="flex:1; display:flex; align-items:center; justify-content:center; text-align:center; color:#323130;">
                          <div>
                            <h2 style="margin-bottom:10px; font-weight:600;">Monitor Cesetti</h2>
                            <div style="color:#605e5c;">No tiene acceso para visualizar este elemento</div>
                          </div>
                        </div>
                    `;
                    initLog(`[APP] Usuario sin acceso: ${usuario}`);
                    return;
                }

                setupEventListeners();
                enlazarActivosNativos();
                feeds_refresh();
                feeds_refreshIntervalId = setInterval(feeds_refresh, FEEDS_REFRESH_SEG * 1000);
                const statusEl = elt.querySelector("#mon-status");
                try {
                    setCargando(true);
                    statusEl.textContent = "Cargando vehículos y geocercas...";
                    await Promise.all([gtb_loadDevices(), gtb_loadDrivers(), gtb_loadZonas(), gtb_loadGrupos(), status_refreshData()]);

                    // Filtro de grupos del mapa: el inicial, cada cambio (evento) y además se
                    // relee en cada refresco por si el evento no llega
                    await filtro_leer();
                    try {
                        service.page.attach("filterChange", data => {
                            if (filtro_aplicar(data && data.groups !== undefined ? data.groups : data)) renderAll();
                        });
                    } catch (err) {
                        console.error("[FILTRO] No se pudo escuchar filterChange:", err);
                    }

                    await mapa_iniciar();

                    statusEl.textContent = `Cargando eventos (${LOOKBACK_HORAS} h)...`;
                    await ev_refreshData();

                    statusEl.textContent = "Resolviendo geocercas de ingreso...";
                    await renderAll();
                    initLog(`[APP] Monitor iniciado: ${vehiculos.length} vehículos afectados`);
                    setCargando(false);

                    status_refreshIntervalId = setInterval(status_refreshData, STATUS_REFRESH_SEG * 1000);
                    ev_refreshIntervalId = setInterval(ev_refreshData, EV_REFRESH_SEG * 1000);
                    render_refreshIntervalId = setInterval(renderAll, RENDER_REFRESH_SEG * 1000);
                } catch (err) {
                    console.error("[APP] Initialization failed:", err);
                    setCargando(false);
                    statusEl.textContent = `Error al inicializar: ${err.message}`;
                    statusEl.classList.add("mon-error");
                }
            }).catch(err => {
                console.error("[Session]", err.message);
                elt.querySelector("#mon-status").textContent = "Error al cargar la sesión";
                elt.querySelector("#mon-status").classList.add("mon-error");
            });
        };

        initLog("[APP] Script loaded");
    </script>
</body>
</html>
