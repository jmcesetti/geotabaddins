<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Monitor Cesetti Map Add-in</title>
</head>
<body>
    <div id="addin-root"></div>

    <!--
    Monitor Cesetti: monitor en tiempo real de los vehículos afectados a SUPE y su tramo actual.

    Replica en el navegador la misma definición de tramos que feed_exception_events.py
    (GestorCiclos), pero sólo para saber en qué tramo está cada unidad AHORA:
1
        ENTER ──────── STOP ──────── EXIT
          └ Espera <T> ──┴── <T> ──────┘      con STOP
          └──────────── <T> ───────────┘      sin STOP

        EXIT de una visita válida (>= 20 min) ── Carreteo ── ENTER siguiente
        SUPE_DELAY durante el Carreteo -> Demora (StandBy si pasa las 2 h)
        Reglas de control (GAS_STATION, SHIFT, TIRESHOP, WORKSHOP) -> visita sin Espera
        Zona mixta -> se infiere por alternancia contra la última Carga/Descarga ("Carga?")

    Pipelines:
        api_helpers      getSession (todos esperan a este)
        gtb_pipeline     Device + User (una vez), Zone SUPE (una vez)
        status_pipeline  DeviceStatusInfo (30s): posición, velocidad, comunicación
        ev_pipeline      ExceptionEvent de las reglas SUPE: carga completa de LOOKBACK_HORAS
                         (cada 30 min) + incremental de los últimos 30 min (cada 60s)
        zona_pipeline    zona de cada ENTER: LogRecord del ingreso + punto en polígono
        render_pipeline  estado por device -> panel (cada 30s); el tramo se suma al tooltip y al
                         menú de los vehículos nativos, y opcionalmente una etiqueta junto a cada uno
        feeds            status.json del gist (cada 60s): estado de los feeds Geotab y SUPE

        Carreteo con rumbo: última visita válida Carga -> "Camino a Descargar", Descarga ->
        "Camino a Cargar" (mixta: por alternancia, sin "?"); otra geocerca -> "Carreteo"

    "Vehículos afectados" = devices con al menos un evento SUPE en la ventana de
    LOOKBACK_HORAS (opcionalmente restringido a GRUPOS_AFECTADOS).
    -->

    <script>
        // Logs informativos y de diagnóstico. Los errores reales (console.error) se loguean siempre.
        const DEBUG = false;
        const dbg = (...args) => { if (DEBUG) console.log(...args); };
        const initLog = (...args) => console.log(...args);

        // ─────────────────────────────────────────────────────────────────────
        //  CONFIGURACIÓN — mismos valores que feed_exception_events.py
        // ─────────────────────────────────────────────────────────────────────
        const REGLAS = {
            ENTER:       "akAzrbsFNF02U11lI13LInA",
            STOP:        "axDLlfKOkSk6TKBw-tMDy5A",
            EXIT:        "amEGV5nbOuUyCbLWq0uEOrA",
            DELAY:       "ax4iOp_UXHkiGZ30plOe9jQ",
            GAS_STATION: "a8BBnzEgyCEC5Znb5qNA6aQ",
            SHIFT:       "asE-Zs26ASkC3YOnuIQ37_w",
            TIRESHOP:    "aDFTkL4ASD0qWv9zHn4knTg",
            WORKSHOP:    "atqVyt5eP8EaoRADoKstgEw"
        };

        const ZONETYPES = {
            "b232": "SUPE_CARGA",
            "b233": "SUPE_DESCARGA",
            "b55F": "SUPE_MIXTA",
            "b56F": "SUPE_ESTACION_SERVICIO",
            "b570": "SUPE_GOMERIA",
            "b56E": "SUPE_RELEVOS",
            "b571": "SUPE_TALLER"
        };

        // Reglas de control por geocerca: regla -> (zoneType, etiqueta del tramo)
        const REGLAS_GEOCERCA = {
            [REGLAS.GAS_STATION]: { zoneType: "SUPE_ESTACION_SERVICIO", etiqueta: "Estacion de Servicio" },
            [REGLAS.SHIFT]:       { zoneType: "SUPE_RELEVOS",           etiqueta: "Relevo" },
            [REGLAS.TIRESHOP]:    { zoneType: "SUPE_GOMERIA",           etiqueta: "Gomeria" },
            [REGLAS.WORKSHOP]:    { zoneType: "SUPE_TALLER",            etiqueta: "Taller" }
        };

        const TIPO_DEFECTO               = "Carga/Descarga";
        const DURACION_MINIMA_VISITA_SEG = 1200;        // por debajo es un paso por la geocerca
        const DEMORA_STANDBY_SEG         = 2 * 3600;    // Demora de más de 2 h -> StandBy
        const OFFSET_LOGRECORD_SEG       = 3;           // posición del ENTER: unos segundos después de cruzar
        const VENTANA_LOGRECORD_SEG      = 60;
        const MAX_PUNTOS_A_PROBAR        = 5;
        const CHOFER_DESCONOCIDO         = "Conductor Desconocido";

        // Propios del monitor
        const LOOKBACK_HORAS        = 48;     // historia para reconstruir la última visita y la alternancia
        const INCREMENTAL_MIN       = 30;     // ventana de cada refresco incremental de eventos
        const EV_REFRESH_SEG        = 60;
        const EV_RECARGA_TOTAL_MIN  = 30;     // recarga completa: descarta eventos invalidados
        const STATUS_REFRESH_SEG    = 30;
        const RENDER_REFRESH_SEG    = 30;
        // Un evento de duración sigue abierto si su activeTo llega hasta el último dato del GO
        const TOLERANCIA_ABIERTO_SEG = 300;
        // Un Carreteo de más de esto se muestra como "Fuera de circuito"
        const CARRETEO_MAX_HORAS    = 24;
        // Restringir los afectados a estos grupos (ids). Vacío = todos los que tengan eventos SUPE.
        const GRUPOS_AFECTADOS      = [];

        // Estado de los feeds (heartbeat que publica el servicio en el gist)
        const FEEDS_STATUS_URL      = "https://gist.githubusercontent.com/jmcesetti/a888c45bc56d139664557d1775df8f61/raw/status.json";
        const FEEDS                 = [{ key: "geotab", label: "Geotab" }, { key: "supe", label: "SUPE" }];
        const FEED_RETRASO_MIN      = 10;     // sin consultar (last_poll) desde hace más de esto -> Con retraso
        const FEED_CAIDO_MIN        = 20;     // sin consultar (last_poll) desde hace más de esto -> Servicio caído
        const FEEDS_REFRESH_SEG     = 60;

        // Usuarios de MyGeotab habilitados a ver el monitor (en minúsculas)
        const LISTA_BLANCA = [
            "jm@cesetti.com.ar",
            "mt@cesetti.com.ar",
            "priva@tsbsa.com.ar",
            "ma@cesetti.com.ar",
            "rgo@cesetti.com.ar",
            "jse@cesetti.com.ar",
            "kdelboni@tsbsa.com.ar",
            "ddelboni@tsbsa.com.ar",
            "esubia@tsbsa.com.ar",
            "coordinacionp6@tsbsa.com.ar",
            "pasantiasit@tsbsa.com.ar"
        ];

        // Estados que muestra el monitor: color en el mapa y categoría para los filtros
        const ESTADOS = {
            "Carga":                { color: "#1d4ed8", cat: "carga" },
            "Descarga":             { color: "#0ea5e9", cat: "descarga" },
            "Carga/Descarga":       { color: "#ec4899", cat: "mixta" },
            "Camino a Cargar":      { color: "#65a30d", cat: "carreteo" },
            "Camino a Descargar":   { color: "#059669", cat: "carreteo" },
            "Carreteo":             { color: "#16a34a", cat: "carreteo" },
            "Demora":               { color: "#f59e0b", cat: "demora" },
            "StandBy":              { color: "#dc2626", cat: "standby" },
            "Estacion de Servicio": { color: "#0d9488", cat: "control" },
            "Relevo":               { color: "#ea580c", cat: "control" },
            "Gomeria":              { color: "#a16207", cat: "control" },
            "Taller":               { color: "#475569", cat: "control" },
            "Ingresando":           { color: "#94a3b8", cat: "otros" },
            "Fuera de circuito":    { color: "#9ca3af", cat: "otros" },
            "Sin clasificar":       { color: "#9ca3af", cat: "otros" }
        };

        const CATEGORIAS = [
            { id: "all",      label: "Todos" },
            { id: "carga",    label: "Carga" },
            { id: "descarga", label: "Descarga" },
            { id: "mixta",    label: "C/D" },
            { id: "carreteo", label: "Carreteo" },
            { id: "demora",   label: "Demora" },
            { id: "standby",  label: "StandBy" },
            { id: "control",  label: "Control" },
            { id: "otros",    label: "Otros" }
        ];

        // ─────────────────────────────────────────────────────────────────────
        //  API HELPERS
        // ─────────────────────────────────────────────────────────────────────
        const ApiHelpers = (() => {
            let _api = null;
            let _session = null;
            let _sessionPromise = null;

            function init(api) {
                _api = api;
                _sessionPromise = _api.api.getSession().then(session => {
                    _session = session;
                    return session;
                }).catch(err => {
                    console.error("[Session] Error loading session:", err.message);
                    throw err;
                });
            }

            function getApi() { return _api; }
            function getSession() { return _session; }
            function getSessionPromise() { return _sessionPromise; }

            return { init, getApi, getSession, getSessionPromise };
        })();

        // multiCall en lotes; si un lote falla entero, se reintenta de a una llamada
        async function multiCallEnLotes(calls, tam = 100) {
            const api = ApiHelpers.getApi();
            const out = [];
            for (let i = 0; i < calls.length; i += tam) {
                const lote = calls.slice(i, i + tam);
                try {
                    const r = await api.api.multiCall(lote);
                    out.push(...r);
                } catch (err) {
                    dbg("[API] multiCall falló, intentando de a uno:", err.message);
                    for (const c of lote) {
                        try {
                            out.push(await api.api.call(c[0], c[1]));
                        } catch (e) {
                            console.error(`[API] ${c[1].typeName}:`, e.message);
                            out.push([]);
                        }
                    }
                }
            }
            return out;
        }

        // Geotab manda las referencias como {id} o como string ("UnknownDriverId")
        const refId = ref => ref == null ? null : (typeof ref === 'object' ? ref.id : ref);

        // ─────────────────────────────────────────────────────────────────────
        //  GTB PIPELINE — Device, User y Zone SUPE (una vez)
        // ─────────────────────────────────────────────────────────────────────
        let GTB_DEVICES = {};
        let GTB_DRIVERS = {};
        let ZONAS = [];

        async function gtb_loadDevices() {
            const api = ApiHelpers.getApi();
            const raw = await api.api.call("Get", { typeName: "Device", resultsLimit: 50000 });
            const now = Date.now();
            GTB_DEVICES = {};
            for (const d of raw) {
                if (d.activeTo && Date.parse(d.activeTo) < now) continue;   // archivados
                GTB_DEVICES[d.id] = {
                    id: d.id,
                    name: d.name,
                    licensePlate: d.licensePlate || '',
                    groups: (d.groups || []).map(g => refId(g))
                };
            }
            initLog(`[GTB] ${Object.keys(GTB_DEVICES).length} devices activos`);
        }

        async function gtb_loadDrivers() {
            try {
                const api = ApiHelpers.getApi();
                const raw = await api.api.call("Get", { typeName: "User", search: { isDriver: true }, resultsLimit: 50000 });
                GTB_DRIVERS = {};
                for (const u of raw) {
                    GTB_DRIVERS[u.id] = [u.firstName, u.lastName].filter(Boolean).join(' ') || u.name;
                }
                initLog(`[GTB] ${raw.length} conductores`);
            } catch (err) {
                console.error("[GTB] Error cargando conductores:", err);
            }
        }

        // Filtro de grupos del mapa (el selector de grupos de MyGeotab). Los grupos son
        // jerárquicos: un device pertenece al filtro si alguno de sus grupos es un grupo
        // elegido o descendiente de uno. null = sin filtro (toda la empresa).
        let GTB_GRUPOS_HIJOS = {};
        let FILTRO_GRUPOS = null;
        let FILTRO_GRUPOS_N = 0;
        // Activos elegidos por el usuario en el mapa (selección de vehículos). null = todos.
        let FILTRO_ACTIVOS = null;
        let FILTRO_ACTIVOS_N = 0;

        async function gtb_loadGrupos() {
            try {
                const api = ApiHelpers.getApi();
                const raw = await api.api.call("Get", { typeName: "Group", resultsLimit: 50000 });
                GTB_GRUPOS_HIJOS = {};
                for (const g of raw) {
                    GTB_GRUPOS_HIJOS[g.id] = (g.children || []).map(c => refId(c));
                }
                initLog(`[GTB] ${raw.length} grupos`);
            } catch (err) {
                console.error("[GTB] Error cargando grupos:", err);
            }
        }

        // Ids de grupo de lo que devuelva Geotab: [{id}], {groups: [...]}, ["b2"] o el filtro
        // avanzado anidado ({groupFilterConditions: [...]}). Se juntan todos los `id` que haya.
        function filtro_extraerIds(x) {
            if (x == null) return [];
            if (typeof x === 'string') return [x];
            if (Array.isArray(x)) return x.flatMap(filtro_extraerIds);
            if (typeof x === 'object') {
                if (typeof x.id === 'string') return [x.id];
                return Object.values(x).flatMap(filtro_extraerIds);
            }
            return [];
        }

        let filtro_ultimaFirma = null;

        // Devuelve true si el filtro cambió respecto del último aplicado
        function filtro_aplicar(raw) {
            const ids = [...new Set(filtro_extraerIds(raw))].filter(id => id in GTB_GRUPOS_HIJOS || /^(b[0-9A-Za-z]+|Group\w*Id)$/.test(id));
            const firma = ids.slice().sort().join(',');
            if (firma !== filtro_ultimaFirma) {
                initLog("[FILTRO] Filtro de grupos del mapa:", raw, "->", ids.length ? ids : "(toda la empresa)");
            }
            const cambio = firma !== filtro_ultimaFirma;
            filtro_ultimaFirma = firma;
            FILTRO_GRUPOS_N = ids.length;
            if (ids.length === 0 || ids.includes("GroupCompanyId")) {
                FILTRO_GRUPOS = null;
                return cambio;
            }
            const set = new Set();
            const cola = [...ids];
            while (cola.length) {
                const id = cola.pop();
                if (set.has(id)) continue;
                set.add(id);
                (GTB_GRUPOS_HIJOS[id] || []).forEach(h => cola.push(h));
            }
            FILTRO_GRUPOS = set;
            return cambio;
        }

        function nombreConductor(driverId) {
            if (!driverId || driverId === "UnknownDriverId" || driverId === "NoDriverId") return CHOFER_DESCONOCIDO;
            return GTB_DRIVERS[driverId] || CHOFER_DESCONOCIDO;
        }

        // Misma traducción que etiqueta_de_zonetypes() del feed
        function etiquetaDeZonetypes(tipos) {
            if (tipos.has("SUPE_MIXTA")) return "Carga/Descarga";
            const carga = tipos.has("SUPE_CARGA");
            const descarga = tipos.has("SUPE_DESCARGA");
            if (carga && descarga) return "Carga/Descarga";
            if (carga) return "Carga";
            if (descarga) return "Descarga";
            for (const r of Object.values(REGLAS_GEOCERCA)) {
                if (tipos.has(r.zoneType)) return r.etiqueta;
            }
            return TIPO_DEFECTO;
        }

        async function gtb_loadZonas() {
            const api = ApiHelpers.getApi();
            const raw = await api.api.call("Get", {
                typeName: "Zone",
                search: { zoneTypes: Object.keys(ZONETYPES).map(id => ({ id })) },
                resultsLimit: 50000
            });
            ZONAS = [];
            for (const z of raw) {
                const tipos = new Set((z.zoneTypes || []).map(t => ZONETYPES[refId(t)]).filter(Boolean));
                const pts = (z.points || []).map(p => [p.x, p.y]);   // [lon, lat]
                if (tipos.size === 0 || pts.length < 3) continue;
                const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
                const bbox = [Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats)];
                ZONAS.push({
                    id: z.id,
                    name: z.name,
                    tipos,
                    etiqueta: etiquetaDeZonetypes(tipos),
                    pts,
                    bbox,
                    area: (bbox[2] - bbox[0]) * (bbox[3] - bbox[1])
                });
            }
            initLog(`[GTB] ${ZONAS.length} geocercas SUPE`);
        }

        function puntoEnPoligono(lon, lat, pts) {
            let dentro = false;
            for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                const [xi, yi] = pts[i], [xj, yj] = pts[j];
                if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) dentro = !dentro;
            }
            return dentro;
        }

        // Geocerca SUPE que contiene el punto. Con zonas anidadas gana la más chica.
        // `filtro` (opcional) limita a las zonas que tengan alguno de esos zoneTypes.
        function zonaEnPunto(lat, lon, filtro) {
            if (lat == null || lon == null) return null;
            let mejor = null;
            for (const z of ZONAS) {
                if (filtro && ![...filtro].some(t => z.tipos.has(t))) continue;
                const b = z.bbox;
                if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) continue;
                if (!puntoEnPoligono(lon, lat, z.pts)) continue;
                if (!mejor || z.area < mejor.area) mejor = z;
            }
            return mejor;
        }

        // ─────────────────────────────────────────────────────────────────────
        //  STATUS PIPELINE — DeviceStatusInfo (30s)
        // ─────────────────────────────────────────────────────────────────────
        let GTB_STATUSINFO = {};

        async function status_refreshData() {
            try {
                const api = ApiHelpers.getApi();
                const raw = await api.api.call("Get", { typeName: "DeviceStatusInfo" });
                const out = {};
                for (const s of raw) {
                    const id = refId(s.device);
                    if (!id) continue;
                    out[id] = {
                        lat: s.latitude,
                        lon: s.longitude,
                        speed: s.speed || 0,
                        bearing: s.bearing,
                        dateTime: s.dateTime,
                        communicates: s.isDeviceCommunicating
                    };
                }
                GTB_STATUSINFO = out;
                dbg(`[StatusInfo] ${Object.keys(out).length} GO`);
                return true;
            } catch (err) {
                console.error("[StatusInfo] Error:", err);
                return false;
            }
        }

        // ─────────────────────────────────────────────────────────────────────
        //  EV PIPELINE — ExceptionEvent de las reglas SUPE
        // ─────────────────────────────────────────────────────────────────────
        // Rol de cada regla en la máquina de ciclos
        const ROL_POR_REGLA = {
            [REGLAS.ENTER]: "ENTER",
            [REGLAS.STOP]:  "STOP",
            [REGLAS.EXIT]:  "EXIT",
            [REGLAS.DELAY]: "DELAY"
        };
        Object.keys(REGLAS_GEOCERCA).forEach(id => { ROL_POR_REGLA[id] = "CONTROL"; });

        // id -> evento normalizado. Geotab reenvía el mismo id mientras el evento sigue
        // abierto (activeTo y distance crecientes): se queda la versión más nueva.
        let EVENTOS = {};
        let ev_ultimaRecargaTotal = 0;

        function ev_normalizar(ev) {
            const ruleId = refId(ev.rule);
            const estado = String(ev.state == null ? '' : ev.state).toLowerCase();
            if (estado.startsWith('inval')) return null;
            const af = Date.parse(ev.activeFrom);
            if (isNaN(af)) return null;
            const at = ev.activeTo ? Date.parse(ev.activeTo) : null;
            return {
                id: ev.id,
                rol: ROL_POR_REGLA[ruleId],
                ruleId,
                devId: refId(ev.device),
                driverId: refId(ev.driver),
                af,
                at: isNaN(at) ? null : at,
                km: Number(ev.distance) || 0
            };
        }

        async function ev_cargar(desdeMs, reemplazar) {
            const fromDate = new Date(desdeMs).toISOString();
            const calls = Object.keys(ROL_POR_REGLA).map(ruleId => ["Get", {
                typeName: "ExceptionEvent",
                search: { ruleSearch: { id: ruleId }, fromDate },
                resultsLimit: 50000
            }]);
            const resultados = await multiCallEnLotes(calls);

            const nuevos = reemplazar ? {} : EVENTOS;
            let n = 0;
            resultados.forEach(lista => {
                (Array.isArray(lista) ? lista : []).forEach(raw => {
                    const ev = ev_normalizar(raw);
                    if (!ev || !ev.rol || !ev.devId) return;
                    const previo = nuevos[ev.id];
                    if (!previo || (ev.at || 0) >= (previo.at || 0)) nuevos[ev.id] = ev;
                    n++;
                });
            });

            // Fuera de la ventana: lo que terminó antes de LOOKBACK_HORAS
            const limite = Date.now() - LOOKBACK_HORAS * 3600e3;
            Object.keys(nuevos).forEach(id => {
                const ev = nuevos[id];
                if ((ev.at || ev.af) < limite) delete nuevos[id];
            });

            EVENTOS = nuevos;
            return n;
        }

        async function ev_refreshData() {
            try {
                const ahora = Date.now();
                if (ahora - ev_ultimaRecargaTotal >= EV_RECARGA_TOTAL_MIN * 60e3) {
                    const n = await ev_cargar(ahora - LOOKBACK_HORAS * 3600e3, true);
                    ev_ultimaRecargaTotal = ahora;
                    initLog(`[EV] Carga completa (${LOOKBACK_HORAS} h): ${n} eventos SUPE`);
                } else {
                    const n = await ev_cargar(ahora - INCREMENTAL_MIN * 60e3, false);
                    dbg(`[EV] Incremental: ${n} eventos`);
                }
                return true;
            } catch (err) {
                console.error("[EV] Error:", err);
                return false;
            }
        }

        // ─────────────────────────────────────────────────────────────────────
        //  ZONA PIPELINE — zona de cada ENTER (LogRecord del ingreso)
        // ─────────────────────────────────────────────────────────────────────
        // enterId -> zona | null (null = no cayó en ninguna geocerca SUPE)
        const ZONA_POR_ENTER = {};
        let zona_pendientes = new Map();   // enterId -> evento

        // Devuelve la zona ya resuelta, o undefined y la encola para el próximo pase
        function zonaDeEnter(ev) {
            if (ev.id in ZONA_POR_ENTER) return ZONA_POR_ENTER[ev.id];
            zona_pendientes.set(ev.id, ev);
            return undefined;
        }

        async function zona_resolverPendientes() {
            const lista = [...zona_pendientes.values()];
            zona_pendientes = new Map();
            if (lista.length === 0) return 0;

            const calls = lista.map(ev => ["Get", {
                typeName: "LogRecord",
                search: {
                    deviceSearch: { id: ev.devId },
                    fromDate: new Date(ev.af - VENTANA_LOGRECORD_SEG * 1000).toISOString(),
                    toDate: new Date(ev.af + VENTANA_LOGRECORD_SEG * 1000).toISOString()
                },
                resultsLimit: 100
            }]);
            const resultados = await multiCallEnLotes(calls);

            lista.forEach((ev, i) => {
                const filtro = ev.rol === "CONTROL"
                    ? new Set([REGLAS_GEOCERCA[ev.ruleId].zoneType])
                    : new Set(["SUPE_CARGA", "SUPE_DESCARGA", "SUPE_MIXTA"]);
                // Primero los puntos más cercanos al ingreso + offset (el del cruce cae afuera)
                const objetivo = ev.af + OFFSET_LOGRECORD_SEG * 1000;
                const registros = (Array.isArray(resultados[i]) ? resultados[i] : [])
                    .filter(r => r.latitude && r.longitude)
                    .sort((a, b) => Math.abs(Date.parse(a.dateTime) - objetivo) - Math.abs(Date.parse(b.dateTime) - objetivo))
                    .slice(0, MAX_PUNTOS_A_PROBAR);
                let zona = null;
                for (const r of registros) {
                    zona = zonaEnPunto(r.latitude, r.longitude, filtro);
                    if (zona) break;
                }
                ZONA_POR_ENTER[ev.id] = zona;
            });
            dbg(`[ZONA] ${lista.length} ingresos resueltos`);
            return lista.length;
        }

        // ─────────────────────────────────────────────────────────────────────
        //  MÁQUINA DE ESTADO — tramo actual de cada device
        // ─────────────────────────────────────────────────────────────────────
        const MIN_VISITA_MS = DURACION_MINIMA_VISITA_SEG * 1000;
        const esIngreso = ev => ev.rol === "ENTER" || ev.rol === "CONTROL";

        // Visitas (último ENTER antes de cada EXIT) y los ingresos que todavía no tienen EXIT
        function reconstruirVisitas(evs) {
            const visitas = [];
            let pendientes = [];
            for (const e of evs) {
                if (esIngreso(e)) {
                    pendientes.push(e);
                } else if (e.rol === "EXIT") {
                    if (pendientes.length) {
                        const enter = pendientes[pendientes.length - 1];   // anidadas: gana el último
                        visitas.push({ enter, exit: e, valida: (e.af - enter.af) >= MIN_VISITA_MS });
                    }
                    pendientes = [];
                }
            }
            return { visitas, abiertas: pendientes };
        }

        const alternar = t => t === "Carga" ? "Descarga" : "Carga";

        // Inferencia en zona mixta: alternancia contra la última Carga/Descarga real del device.
        // Las mixtas intermedias ya fueron inferidas en su momento, así que cada una alterna de nuevo.
        // Devuelve "Carga" | "Descarga" | null (sin memoria) | undefined (falta resolver zonas)
        function inferirMixta(visitasPrevias) {
            let mixtas = 0;
            for (let i = visitasPrevias.length - 1; i >= 0; i--) {
                const v = visitasPrevias[i];
                if (!v.valida || v.enter.rol !== "ENTER") continue;
                const zona = zonaDeEnter(v.enter);
                if (zona === undefined) return undefined;
                const tipo = zona ? zona.etiqueta : TIPO_DEFECTO;
                if (tipo === "Carga" || tipo === "Descarga") {
                    let r = tipo;
                    for (let k = 0; k <= mixtas; k++) r = alternar(r);
                    return r;
                }
                if (tipo === "Carga/Descarga") mixtas++;
            }
            return null;
        }

        // Tipo operativo de una visita: "Carga" | "Descarga" (mixtas por alternancia),
        // otra etiqueta si no es ninguna, null si es de control, undefined si falta resolver la zona
        function tipoOperativo(visita, visitas) {
            if (visita.enter.rol !== "ENTER") return null;
            const zona = zonaDeEnter(visita.enter);
            if (zona === undefined) return undefined;
            let tipo = zona ? zona.etiqueta : TIPO_DEFECTO;
            if (tipo === "Carga/Descarga") {
                const t = inferirMixta(visitas.filter(v => v.exit.af <= visita.enter.af));
                if (t) tipo = t;
            }
            return tipo;
        }

        // ETA de un "Camino a ...": duración del último carreteo de la misma unidad en el mismo
        // sentido (salida de una visita del mismo tipo hasta el ingreso a la siguiente Carga o
        // Descarga; las visitas de control intermedias no lo cortan). Se prefiere el que salió
        // de la misma geocerca; si no hay, el más reciente. null = sin referencia en la ventana.
        function estimarEta(validas, visitas, tipoOrigen, zonaOrigen, salida) {
            const tipoDestino = tipoOrigen === "Carga" ? "Descarga" : "Carga";
            let mismaZona = null, cualquiera = null;
            // La última visita válida es el origen del carreteo actual: se buscan las anteriores
            for (let i = validas.length - 2; i >= 0 && !mismaZona; i--) {
                if (tipoOperativo(validas[i], visitas) !== tipoOrigen) continue;
                for (let j = i + 1; j < validas.length; j++) {
                    const t = tipoOperativo(validas[j], visitas);
                    if (t === null) continue;                      // control: sigue siendo el mismo viaje
                    if (t !== tipoDestino) break;                  // volvió al mismo tipo o sin resolver
                    const dur = validas[j].enter.af - validas[i].exit.af;
                    if (dur <= 0 || dur > CARRETEO_MAX_HORAS * 3600e3) break;
                    const zi = zonaDeEnter(validas[i].enter), zj = zonaDeEnter(validas[j].enter);
                    const ref = { dur, desde: zi ? zi.name : null, hasta: zj ? zj.name : null, salida: validas[i].exit.af };
                    if (!cualquiera) cualquiera = ref;
                    if (zi && zonaOrigen && zi.id === zonaOrigen.id) mismaZona = ref;
                    break;
                }
            }
            const ref = mismaZona || cualquiera;
            return ref ? { llegada: salida + ref.dur, ref } : null;
        }

        function calcularEstado(devId, evs) {
            const info = GTB_STATUSINFO[devId] || null;
            const ahora = Date.now();
            // "Ahora" de los eventos: el último dato del GO (si no comunica, sus excepciones quedan ahí)
            const ultimoDato = info && info.dateTime ? Date.parse(info.dateTime) : ahora;
            const abierto = ev => ev.at == null || ev.at >= ultimoDato - TOLERANCIA_ABIERTO_SEG * 1000;

            const { visitas, abiertas } = reconstruirVisitas(evs);
            const exits = evs.filter(e => e.rol === "EXIT");
            const ultimoExit = exits[exits.length - 1] || null;
            const enter = abiertas[abiertas.length - 1] || null;

            const base = {
                estado: "Sin clasificar", inferido: false, provisional: false,
                desde: null, zona: null, espera: null, km: null,
                driverId: (enter || ultimoExit || evs[evs.length - 1] || {}).driverId || null
            };

            // Demora: SUPE_DELAY abierto, posterior a la salida y a cualquier ingreso
            const delays = evs.filter(e => e.rol === "DELAY" && abierto(e)
                && (!ultimoExit || e.af >= ultimoExit.af) && (!enter || e.af > enter.af));
            const demora = delays[delays.length - 1] || null;
            if (demora) {
                const seg = (ahora - demora.af) / 1000;
                const lugar = info ? zonaEnPunto(info.lat, info.lon) : null;
                return Object.assign(base, {
                    estado: seg > DEMORA_STANDBY_SEG ? "StandBy" : "Demora",
                    desde: demora.af,
                    zona: lugar ? lugar.name : null,
                    driverId: demora.driverId || base.driverId
                });
            }

            // Visita en curso: el último ingreso sin EXIT
            if (enter) {
                const provisional = (ahora - enter.af) < MIN_VISITA_MS;
                if (enter.rol === "CONTROL") {
                    const zona = zonaDeEnter(enter);
                    return Object.assign(base, {
                        estado: REGLAS_GEOCERCA[enter.ruleId].etiqueta,
                        desde: enter.af,
                        zona: zona ? zona.name : (zona === undefined ? "resolviendo..." : null),
                        provisional
                    });
                }

                let zona = zonaDeEnter(enter);
                // Mientras se resuelve el LogRecord del ingreso, la posición actual es buena aproximación
                if (zona === undefined && info) zona = zonaEnPunto(info.lat, info.lon, new Set(["SUPE_CARGA", "SUPE_DESCARGA", "SUPE_MIXTA"])) || undefined;
                let tipo = zona ? zona.etiqueta : TIPO_DEFECTO;
                let inferido = false;
                if (tipo === "Carga/Descarga") {
                    const t = inferirMixta(visitas.filter(v => v.exit.af <= enter.af));
                    if (t) { tipo = t; inferido = true; }
                }

                // Espera: del ENTER al último STOP; el operativo arranca en el STOP
                const stops = evs.filter(e => e.rol === "STOP" && e.af > enter.af && e.af <= ahora);
                const stop = stops[stops.length - 1] || null;
                return Object.assign(base, {
                    estado: tipo,
                    inferido,
                    provisional,
                    desde: stop ? stop.af : enter.af,
                    espera: stop ? { desde: enter.af, hasta: stop.af } : null,
                    zona: zona ? zona.name : (zona === undefined ? "resolviendo..." : "Sin geocerca resuelta")
                });
            }

            if (ultimoExit) {
                if (abierto(ultimoExit)) {
                    // Carreteo desde el EXIT de la última visita válida; los pasos (< 20 min) no lo cortan
                    const validas = visitas.filter(v => v.valida);
                    const origen = validas.length ? validas[validas.length - 1].exit : exits[0];
                    const km = exits.filter(e => e.af >= origen.af).reduce((s, e) => s + e.km, 0);
                    const ultimaVisita = validas[validas.length - 1];
                    const zonaOrigen = ultimaVisita ? zonaDeEnter(ultimaVisita.enter) : null;

                    // Rumbo: si la última visita válida fue Carga va a descargar, y viceversa.
                    // Otra geocerca (control, sin resolver o mixta sin memoria): Carreteo genérico.
                    let estado = "Carreteo";
                    let eta = null;
                    if (ultimaVisita) {
                        const tipo = tipoOperativo(ultimaVisita, visitas);
                        if (tipo === "Carga") estado = "Camino a Descargar";
                        else if (tipo === "Descarga") estado = "Camino a Cargar";
                        if (tipo === "Carga" || tipo === "Descarga") {
                            eta = estimarEta(validas, visitas, tipo, zonaOrigen, origen.af);
                        }
                    }
                    const fuera = (ahora - origen.af) > CARRETEO_MAX_HORAS * 3600e3;
                    return Object.assign(base, {
                        estado: fuera ? "Fuera de circuito" : estado,
                        eta: fuera ? null : eta,
                        desde: origen.af,
                        km: Math.round(km * 100) / 100,
                        zona: zonaOrigen ? `desde ${zonaOrigen.name}` : null
                    });
                }
                // El EXIT cerró pero el ENTER todavía no llegó, o la unidad está en una zona no informada (Base)
                const lugar = info ? zonaEnPunto(info.lat, info.lon) : null;
                return Object.assign(base, {
                    estado: lugar ? "Ingresando" : "Fuera de circuito",
                    desde: ultimoExit.at,
                    zona: lugar ? lugar.name : null
                });
            }

            return base;
        }

        // ─────────────────────────────────────────────────────────────────────
        //  ADD-IN
        // ─────────────────────────────────────────────────────────────────────
        geotab.addin.monitorSupe = function (elt, service) {
            ApiHelpers.init(service);
            let vehiculos = [];
            let currentFilter = 'all';
            let currentSearch = '';
            let render_refreshIntervalId = null;
            let status_refreshIntervalId = null;
            let ev_refreshIntervalId = null;

            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            function formatHora(ms) {
                if (!ms) return 'N/A';
                return new Intl.DateTimeFormat('es-AR', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
                    hour12: false, timeZone: 'America/Argentina/Buenos_Aires'
                }).format(new Date(ms));
            }

            function formatDuracion(ms) {
                if (ms == null || ms < 0) return '-';
                const min = Math.floor(ms / 60000);
                const h = Math.floor(min / 60);
                if (h >= 24) return `${Math.floor(h / 24)}d ${h % 24}h`;
                return h > 0 ? `${h}h ${String(min % 60).padStart(2, '0')}m` : `${min}m`;
            }

            const etiquetaEstado = v => v.estado + (v.inferido ? '?' : '');

            function formatHoraCorta(ms) {
                return new Intl.DateTimeFormat('es-AR', {
                    hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Argentina/Buenos_Aires'
                }).format(new Date(ms));
            }

            // Tiempo como cuenta regresiva: 01:30hs (minutos redondeados hacia arriba)
            function formatHHMM(ms) {
                const min = Math.max(0, Math.ceil(ms / 60000));
                return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}hs`;
            }

            // ETA de un "Camino a ...": tiempo que falta para llegar. Se recalcula en cada render
            // (cada 30 s), así que baja a medida que pasa el tiempo. Pasada la llegada estimada
            // muestra el atraso: ETA +00:20hs.
            function etaInfo(v) {
                if (!v.eta) return null;
                const resta = v.eta.llegada - Date.now();
                const r = v.eta.ref;
                const atrasado = resta < 0;
                const tiempo = (atrasado ? '+' : '') + formatHHMM(Math.abs(resta));
                return {
                    hora: formatHoraCorta(v.eta.llegada),
                    atrasado,
                    tiempo,
                    corto: `ETA ${tiempo}`,
                    base: `Estimado con su último carreteo en este sentido: ${formatDuracion(r.dur)}`
                        + (r.desde || r.hasta ? ` (${r.desde || '?'} → ${r.hasta || '?'}, salió ${formatHora(r.salida)})` : '')
                };
            }

            // Íconos de línea (stroke en currentColor) en lugar de emojis
            const svgIco = d => `<svg class="mon-ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
            const ICO = {
                dash:    svgIco('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
                list:    svgIco('<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>'),
                refresh: svgIco('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>'),
                ok:      svgIco('<path d="M4 12.5l5 5L20 6.5"/>'),
                err:     svgIco('<path d="M6 6l12 12M18 6L6 18"/>')
            };
            const btnHtml = (ico, texto) => `${ico}<span>${texto}</span>`;

            // Indicador de carga: barra fina arriba del panel y estado del pie en azul
            const setCargando = on => { const r = elt.querySelector("#mon-root"); if (r) r.classList.toggle('mon-cargando', on); };

            // Animaciones de la lista: entrada escalonada solo en la primera carga y al cambiar
            // filtro o búsqueda; en los refrescos periódicos solo destella lo que cambió de estado.
            let lista_animarEntrada = true;
            const lista_estadoPrevio = {};

            // Eventos agrupados por device, ordenados por activeFrom
            function eventosPorDevice() {
                const porDevice = {};
                Object.values(EVENTOS).forEach(ev => {
                    (porDevice[ev.devId] = porDevice[ev.devId] || []).push(ev);
                });
                Object.values(porDevice).forEach(evs => evs.sort((a, b) => a.af - b.af));
                return porDevice;
            }

            // Devices afectados (dentro del filtro de grupos del mapa) con su estado actual
            function construirVehiculos() {
                const porDevice = eventosPorDevice();

                const out = [];
                Object.keys(porDevice).forEach(devId => {
                    const device = GTB_DEVICES[devId];
                    if (!device) return;
                    if (GRUPOS_AFECTADOS.length && !device.groups.some(g => GRUPOS_AFECTADOS.includes(g))) return;
                    if (FILTRO_GRUPOS && !device.groups.some(g => FILTRO_GRUPOS.has(g))) return;
                    if (FILTRO_ACTIVOS && !FILTRO_ACTIVOS.has(devId)) return;
                    const evs = porDevice[devId];
                    const estado = calcularEstado(devId, evs);
                    const info = GTB_STATUSINFO[devId] || null;
                    out.push(Object.assign({
                        id: devId,
                        name: device.name,
                        licensePlate: device.licensePlate,
                        lat: info ? info.lat : null,
                        lon: info ? info.lon : null,
                        speed: info ? Math.round(info.speed) : 0,
                        communicates: info ? info.communicates : null,
                        lastData: info && info.dateTime ? Date.parse(info.dateTime) : null
                    }, estado));
                });
                return out.sort((a, b) => a.name.localeCompare(b.name));
            }

            // Calcula estados; si quedaron ingresos sin zona, los resuelve y recalcula
            async function actualizarEstados() {
                vehiculos = construirVehiculos();
                for (let pase = 0; pase < 5 && zona_pendientes.size > 0; pase++) {
                    await zona_resolverPendientes();
                    vehiculos = construirVehiculos();
                }
            }

            // Parte que se suma al tooltip nativo (el nombre del vehículo ya lo muestra Geotab)
            function tooltipDe(v) {
                const e = etaInfo(v);
                const sec = [e
                    ? `ETA ${e.tiempo}${e.atrasado ? ' (atrasado)' : ''} · llegada estimada ${e.hora} · salió ${formatHora(v.desde)}`
                    : `En el tramo: ${formatDuracion(Date.now() - v.desde)} · desde ${formatHora(v.desde)}`];
                if (v.zona) sec.push(v.zona);
                if (v.espera) sec.push(`Espera: ${formatDuracion(v.espera.hasta - v.espera.desde)}`);
                if (v.km != null) sec.push(`${v.km} km`);
                return {
                    main: `Cesetti: ${etiquetaEstado(v)}${v.provisional ? ' (validando)' : ''}`,
                    secondary: sec
                };
            }

            // No se dibuja nada en el mapa: el estado se agrega a los activos nativos de Geotab.
            //   - Tooltip: al pasar sobre un vehículo, tooltip.show() suma el tramo al tooltip nativo.
            //   - Menú del vehículo: un ítem con el tramo actual que lleva a su fila en el panel.
            //   - Click en el vehículo: resalta su fila en el panel.
            const vehiculoPorId = id => vehiculos.find(v => v.id === id) || null;
            const EVENTO_MENU = "monSupeVerEnPanel";

            function enlazarActivosNativos() {
                service.events.attach("over", data => {
                    if (!data || data.type !== "device" || !data.entity) return;
                    const v = vehiculoPorId(data.entity.id);
                    if (v) service.tooltip.show(tooltipDe(v), 1);
                });

                service.events.attach("click", data => {
                    if (!data || data.type !== "device" || !data.entity) return;
                    const v = vehiculoPorId(data.entity.id);
                    if (!v) return;
                    // Desde el mapa no se recentra: el usuario ya está mirando la unidad.
                    // Click sobre la unidad ya seleccionada: se deselecciona.
                    seleccionId = seleccionId === v.id ? null : v.id;
                    dibujarSeleccion();
                    if (seleccionId) resaltarFila(v.id);
                    elt.querySelectorAll('.mon-row').forEach(r => r.classList.toggle('mon-row-selected', r.dataset.id === seleccionId));
                });

                service.actionList.attachMenu("device", (menuName, data) => {
                    const v = data && data.device ? vehiculoPorId(data.device.id) : null;
                    if (!v) return [];
                    return [{
                        title: `Cesetti: ${etiquetaEstado(v)} · ${v.eta ? etaInfo(v).corto : formatDuracion(Date.now() - v.desde)}`,
                        clickEvent: EVENTO_MENU,
                        data: { id: v.id }
                    }];
                });

                // La documentación no es clara sobre qué evento dispara el botón (el nombre de
                // clickEvent o "CustomEvent"): se escuchan los dos.
                const alClickMenu = data => {
                    const id = data && (data.id || (data.data && data.data.id));
                    if (id) resaltarFila(id);
                };
                service.actionList.attach(EVENTO_MENU, alClickMenu);
                service.actionList.attach("CustomEvent", alClickMenu);
            }

            // Muestra la fila del vehículo en el panel (quita filtros y búsqueda si la ocultan)
            function resaltarFila(id) {
                let row = elt.querySelector(`.mon-row[data-id="${CSS.escape(id)}"]`);
                if (!row) {
                    currentFilter = 'all';
                    currentSearch = '';
                    elt.querySelector("#mon-search").value = '';
                    elt.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
                    renderLista(vehiculos);
                    renderContadores(vehiculos);
                    dibujarEtiquetas();
                    mapa_aplicarPronto();
                    row = elt.querySelector(`.mon-row[data-id="${CSS.escape(id)}"]`);
                }
                if (!row) return;
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                row.classList.add('mon-row-focus');
                setTimeout(() => row.classList.remove('mon-row-focus'), 2000);
            }

            // Búsqueda por nombre, patente o geocerca (aplica a la lista y a los contadores)
            function filtrarBusqueda(lista) {
                const s = currentSearch.trim().toLowerCase();
                if (!s) return lista;
                return lista.filter(v => v.name.toLowerCase().includes(s) || v.licensePlate.toLowerCase().includes(s)
                    || (v.zona || '').toLowerCase().includes(s));
            }

            function filtrar(lista) {
                let f = filtrarBusqueda(lista);
                if (currentFilter !== 'all') f = f.filter(v => (ESTADOS[v.estado] || ESTADOS["Sin clasificar"]).cat === currentFilter);
                return f;
            }

            // Selección: lo único que se dibuja en el mapa es un anillo alrededor de la unidad
            // seleccionada (la API no permite resaltar el vehículo nativo). Se mueve con cada
            // refresco y se quita volviendo a hacer clic en la fila o con Esc.
            let seleccionId = null;
            let seleccionAnillo = null;

            function dibujarSeleccion() {
                if (seleccionAnillo) { seleccionAnillo.remove(); seleccionAnillo = null; }
                const v = seleccionId ? vehiculoPorId(seleccionId) : null;
                if (!v || !v.lat || !v.lon) return;
                seleccionAnillo = service.canvas.circle({ lat: v.lat, lng: v.lon }, 22, 10)
                    .change({ "fill": "#ff1fa8", "fill-opacity": 0.18, "stroke": "#ff1fa8", "stroke-width": 4 });
            }

            function seleccionar(v) {
                seleccionId = seleccionId === v.id ? null : v.id;
                elt.querySelectorAll('.mon-row').forEach(r => r.classList.toggle('mon-row-selected', r.dataset.id === seleccionId));
                dibujarSeleccion();
                if (seleccionId) centrar(v);
            }

            async function centrar(v) {
                try {
                    etq_pausar(2500);
                    const pad = 0.01;
                    await service.map.setBounds({
                        sw: { lat: v.lat - pad, lng: v.lon - pad },
                        ne: { lat: v.lat + pad, lng: v.lon + pad }
                    });
                } catch (e) {
                    console.error("[MAP] Error al centrar:", e);
                }
            }

            // ─────────────────────────────────────────────────────────────────
            //  ETIQUETAS EN EL MAPA — estado actual junto a cada vehículo nativo
            // ─────────────────────────────────────────────────────────────────
            // Un marker SVG por unidad, anclado a la derecha del ícono nativo (dx = separación).
            // Siguen al filtro y a la búsqueda del panel. La API no permite mover un marker:
            // en cada redibujo se dibujan los nuevos y después se borran los viejos.
            const ETQ_STORAGE_KEY = "monitorSupe.etiquetas";
            const ETQ_FONT = "600 11px 'Segoe UI', Roboto, Arial, sans-serif";
            const ETQ_ALTO = 20;
            const ETQ_SESGO = 6;            // inclinación de los lados del paralelogramo
            const ETQ_SEPARACION = 16;      // desde el centro del vehículo hasta el recuadro
            let etiquetasVisibles = true;
            try { etiquetasVisibles = localStorage.getItem(ETQ_STORAGE_KEY) !== "0"; } catch (e) { /* sin storage */ }
            let etq_items = [];
            let etq_ctx = null;
            let etq_cache = {};
            let etq_pausaHasta = 0;
            let etq_pendiente = false;
            let etq_timer = null;

            function etq_anchoTexto(texto) {
                try {
                    if (!etq_ctx) etq_ctx = document.createElement('canvas').getContext('2d');
                    etq_ctx.font = ETQ_FONT;
                    return Math.ceil(etq_ctx.measureText(texto).width);
                } catch (e) {
                    return Math.ceil(texto.length * 6.5);
                }
            }

            function etq_svg(texto, color) {
                const key = `${color}|${texto}`;
                if (etq_cache[key]) return etq_cache[key];
                if (Object.keys(etq_cache).length > 2000) etq_cache = {};   // las duraciones cambian: se recicla
                // Paralelogramo del mismo alto y ancho que el recuadro: los lados se inclinan ETQ_SESGO px.
                // El letter-spacing (0.3 px por carácter) no lo mide measureText: se suma aparte.
                const ancho = Math.ceil(etq_anchoTexto(texto) + texto.length * 0.3) + 18;
                const s = ETQ_SESGO, a = ETQ_ALTO - 0.5;
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${ancho}" height="${ETQ_ALTO}" viewBox="0 0 ${ancho} ${ETQ_ALTO}">` +
                    `<polygon points="${s + 0.5},0.5 ${ancho - 0.5},0.5 ${ancho - s - 0.5},${a} 0.5,${a}" fill="#ffffff" stroke="${color}" stroke-width="1" stroke-linejoin="miter"/>` +
                    `<polygon points="${s + 0.5},0.5 ${s + 4.5},0.5 4.5,${a} 0.5,${a}" fill="${color}"/>` +
                    `<text x="11" y="${ETQ_ALTO / 2 + 4}" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.3" fill="#0f1a2b">${esc(texto)}</text>` +
                    `</svg>`;
                etq_cache[key] = { uri: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg), ancho };
                return etq_cache[key];
            }

            const etq_texto = v => etiquetaEstado(v) + (v.eta ? ` · ${etaInfo(v).corto}`
                : (v.desde ? ` · ${formatDuracion(Date.now() - v.desde)}` : ''));

            // Redibujar markers en medio de un setBounds o un arrastre hace que MyGeotab vuelva
            // a la vista anterior: mientras el mapa se mueve, el redibujo queda pendiente.
            function etq_pausar(ms) {
                etq_pausaHasta = Math.max(etq_pausaHasta, Date.now() + ms);
                clearTimeout(etq_timer);
                etq_timer = setTimeout(() => { if (etq_pendiente) dibujarEtiquetas(); }, etq_pausaHasta - Date.now() + 50);
            }
            try {
                service.map.attach("change", () => etq_pausar(1000));
                service.map.attach("changed", () => etq_pausar(500));
            } catch (err) {
                dbg("[MAP] No se pudo escuchar los cambios de vista:", err);
            }

            function dibujarEtiquetas() {
                if (Date.now() < etq_pausaHasta) { etq_pendiente = true; return; }
                etq_pendiente = false;
                const nuevos = [];
                if (etiquetasVisibles) {
                    filtrar(vehiculos).forEach(v => {
                        if (!v.lat || !v.lon) return;
                        try {
                            const cfg = ESTADOS[v.estado] || ESTADOS["Sin clasificar"];
                            const m = etq_svg(etq_texto(v), cfg.color);
                            const marker = service.canvas.marker({ lat: v.lat, lng: v.lon }, m.ancho, ETQ_ALTO, m.uri, 9)
                                .change({ "dx": ETQ_SEPARACION, "dy": -ETQ_ALTO / 2 });
                            marker
                                .attach("over", coords => {
                                    const actual = vehiculoPorId(v.id) || v;
                                    const t = tooltipDe(actual);
                                    service.tooltip.showAt(coords, { main: `${actual.name} · ${t.main}`, secondary: t.secondary }, 1);
                                })
                                .attach("out", () => service.tooltip.hide())
                                .attach("click", () => resaltarFila(v.id));
                            nuevos.push(marker);
                        } catch (err) {
                            console.error("[MAP] No se pudo dibujar la etiqueta:", err);
                        }
                    });
                }
                // Primero lo nuevo y después se borra lo viejo: evita el parpadeo
                etq_items.forEach(item => { try { item.remove(); } catch (e) { /* ya no existe */ } });
                etq_items = nuevos;
            }

            function toggleEtiquetas(visible) {
                etiquetasVisibles = visible;
                try { localStorage.setItem(ETQ_STORAGE_KEY, visible ? "1" : "0"); } catch (e) { /* sin storage */ }
                etq_pausaHasta = 0;
                dibujarEtiquetas();
            }

            // ─────────────────────────────────────────────────────────────────
            //  ESTADO DE LOS FEEDS — status.json del gist
            // ─────────────────────────────────────────────────────────────────
            let feeds_refreshIntervalId = null;

            function feeds_clasificar(fuente, servicio) {
                if (!fuente) return { cls: 'off', texto: 'Sin información' };
                if (fuente.enabled === false) return { cls: 'off', texto: 'Deshabilitado' };
                // Se mide por la última consulta: una fuente puede pasar ratos sin datos nuevos
                // y seguir sana. Las que no informan last_poll (SUPE) se miden por last_data.
                const ultimo = Date.parse(fuente.last_poll || fuente.last_data);
                const edadMin = isNaN(ultimo) ? Infinity : (Date.now() - ultimo) / 60000;
                if (servicio.status !== 'online' || fuente.running === false || edadMin > FEED_CAIDO_MIN) {
                    return { cls: 'down', texto: 'Servicio caído', edadMin };
                }
                if (edadMin > FEED_RETRASO_MIN) return { cls: 'warn', texto: `Con retraso (${formatDuracion(edadMin * 60000)})`, edadMin };
                return { cls: 'ok', texto: 'Comunicando', edadMin };
            }

            async function feeds_refresh() {
                const cont = elt.querySelector("#mon-feeds");
                if (!cont) return;
                try {
                    const resp = await fetch(`${FEEDS_STATUS_URL}?t=${Date.now()}`, { cache: 'no-store' });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const st = await resp.json();
                    const fuentes = st.sources || {};
                    const errores = st.errors || {};
                    cont.innerHTML = FEEDS.map(f => {
                        const src = fuentes[f.key];
                        const c = feeds_clasificar(src, st);
                        const det = [
                            `${f.label}: ${c.texto}`,
                            src && src.last_data ? `Último dato: ${formatHora(Date.parse(src.last_data))}` : null,
                            src && src.last_poll ? `Última consulta: ${formatHora(Date.parse(src.last_poll))}` : null,
                            st.last_heartbeat ? `Heartbeat del servicio: ${formatHora(Date.parse(st.last_heartbeat))}` : null,
                            errores[f.key] != null ? `Errores: ${errores[f.key]}` : null
                        ].filter(Boolean).join('\n');
                        return `<span class="mon-feed mon-feed-${c.cls}" title="${esc(det)}"><i></i>${esc(f.label)}: ${esc(c.texto)}</span>`;
                    }).join('');
                } catch (err) {
                    console.error("[FEEDS]", err);
                    cont.innerHTML = `<span class="mon-feed mon-feed-off" title="${esc(err.message)}"><i></i>Feeds: sin información</span>`;
                }
            }

            function renderLista(lista) {
                const container = elt.querySelector("#mon-list");
                const filtrados = filtrar(lista);
                container.innerHTML = '';

                if (filtrados.length === 0) {
                    container.innerHTML = '<div class="mon-empty">No hay vehículos</div>';
                    return;
                }

                // Agrupado por estado, en el orden de ESTADOS
                const animar = lista_animarEntrada;
                lista_animarEntrada = false;
                let i = 0;
                Object.keys(ESTADOS).forEach(estado => {
                    const grupo = filtrados.filter(v => v.estado === estado);
                    if (grupo.length === 0) return;
                    const cfg = ESTADOS[estado];

                    const title = document.createElement('div');
                    title.className = 'mon-group';
                    title.style.setProperty('--c', cfg.color);
                    title.innerHTML = `<span>${esc(estado)}</span><b>${grupo.length}</b>`;
                    container.appendChild(title);

                    // Los que llevan más tiempo en el tramo, primero
                    grupo.sort((a, b) => (a.desde || 0) - (b.desde || 0)).forEach(v => {
                        const row = document.createElement('div');
                        row.className = 'mon-row' + (v.lat && v.lon ? '' : ' mon-row-disabled')
                            + (v.id === seleccionId ? ' mon-row-selected' : '');
                        row.dataset.id = v.id;
                        row.style.setProperty('--c', cfg.color);
                        if (animar) {
                            row.classList.add('mon-row-enter');
                            row.style.setProperty('--i', Math.min(i++, 10));
                        } else if (lista_estadoPrevio[v.id] && lista_estadoPrevio[v.id] !== v.estado) {
                            row.classList.add('mon-changed');
                        }
                        lista_estadoPrevio[v.id] = v.estado;
                        const dur = v.desde ? formatDuracion(Date.now() - v.desde) : '-';

                        const badges = [
                            `<span class="mon-tag mon-tag-estado" style="--c:${cfg.color};">${esc(etiquetaEstado(v))}</span>`
                        ];
                        if (v.provisional) badges.push('<span class="mon-tag mon-tag-warn" title="Menos de 20 min adentro: puede ser un paso por la geocerca">Validando</span>');
                        if (v.inferido) badges.push('<span class="mon-tag mon-tag-info" title="Zona mixta: tipo inferido por alternancia">Inferido</span>');
                        if (v.communicates === false) badges.push('<span class="mon-tag mon-tag-off">GO sin comunicar</span>');

                        const kv = [];
                        const par = (k, val) => kv.push(`<dt>${k}</dt><dd>${val}</dd>`);
                        const mono = s => `<span class="mon-mono">${s}</span>`;
                        if (v.zona) par('Geocerca', esc(v.zona));
                        if (v.espera) par('Espera', `${mono(formatDuracion(v.espera.hasta - v.espera.desde))} <span class="mon-mute">${mono(formatHora(v.espera.desde))}</span>`);
                        const e = etaInfo(v);
                        if (e) {
                            par('ETA', `<span title="${esc(e.base)}">`
                                + (e.atrasado ? `<span class="mon-atrasado">${mono(e.tiempo)} atrasado</span>` : `<b class="mon-eta">${mono(e.tiempo)}</b>`)
                                + ` <span class="mon-mute">llegada ~${mono(e.hora)}</span></span>`);
                            par('Salida', mono(formatHora(v.desde)));
                        } else {
                            par('En el tramo', `${mono(dur)} <span class="mon-mute">desde ${mono(formatHora(v.desde))}</span>`);
                        }
                        if (v.km != null) par('Recorrido', mono(`${v.km} km`));
                        par('Conductor', esc(nombreConductor(v.driverId)));
                        par('Velocidad', `${mono(`${v.speed} km/h`)} <span class="mon-mute">· ${mono(formatHora(v.lastData))}</span>`);

                        row.innerHTML = `
                            <div class="mon-row-head">
                                <span class="mon-name">${esc(v.name)}</span>
                                <span class="mon-plate">${esc(v.licensePlate)}</span>
                            </div>
                            <div class="mon-badges">${badges.join('')}</div>
                            <dl class="mon-kv">${kv.join('')}</dl>
                        `;
                        if (v.lat && v.lon) row.addEventListener('click', () => seleccionar(v));
                        container.appendChild(row);
                    });
                });
            }

            // ─────────────────────────────────────────────────────────────────
            //  DASHBOARD — estadísticas del día (desde las 00:00 hora local)
            // ─────────────────────────────────────────────────────────────────
            // Se reconstruyen los tramos del día con la misma máquina de ciclos del estado
            // actual, sobre los vehículos dentro del filtro de grupos del mapa.
            let dashVisible = false;
            let dashCalculando = false;
            // Valores del render anterior (contadores y barras animan desde ahí)
            let dash_prev = {};

            function dash_contar(el, desde, hasta, ms) {
                const t0 = performance.now();
                const ease = x => 1 - Math.pow(1 - x, 3);
                const fmt = x => Math.round(x).toLocaleString('es-AR');
                // El timestamp de rAF es el inicio del frame y puede ser anterior a t0: se acota a [0, 1]
                (function paso(ahora) {
                    const p = Math.max(0, Math.min(1, (ahora - t0) / ms));
                    el.textContent = fmt(desde + (hasta - desde) * ease(p));
                    if (p < 1) requestAnimationFrame(paso);
                })(t0);
                // Si la pestaña está en segundo plano rAF no corre: el valor final queda igual
                setTimeout(() => { el.textContent = fmt(hasta); }, ms + 100);
            }

            function dash_animar(cont) {
                const reducido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const nuevo = {};
                cont.querySelectorAll('[data-num]').forEach(el => {
                    const k = 'n|' + el.dataset.k, hasta = Number(el.dataset.num);
                    const desde = k in dash_prev ? dash_prev[k] : 0;
                    nuevo[k] = hasta;
                    if (!reducido && desde !== hasta) dash_contar(el, desde, hasta, 550);
                });
                const fills = [...cont.querySelectorAll('.mon-hbar-fill[data-w]')];
                fills.forEach(el => {
                    const k = 'b|' + el.dataset.k;
                    el.style.width = (k in dash_prev ? dash_prev[k] : 0) + '%';
                    nuevo[k] = Number(el.dataset.w);
                });
                if (fills.length) {
                    void cont.offsetWidth;   // fuerza el ancho inicial antes de la transición
                    fills.forEach(el => { el.style.width = el.dataset.w + '%'; });
                }
                dash_prev = nuevo;
            }
            const OFFSET_LOCAL_MS = 3 * 3600e3;   // Argentina, UTC-3 (igual que TZ_LOCAL del feed)
            const inicioDelDia = ms => Math.floor((ms - OFFSET_LOCAL_MS) / 86400e3) * 86400e3 + OFFSET_LOCAL_MS;
            const horaLocal = ms => new Date(ms - OFFSET_LOCAL_MS).getUTCHours();
            const promedio = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;

            // Tipo de una visita de ENTER: el de su zona, o inferido si es mixta.
            // undefined = falta resolver la zona (queda encolada).
            function tipoDeVisita(enter, visitasPrevias) {
                const zona = zonaDeEnter(enter);
                if (zona === undefined) return undefined;
                const tipo = zona ? zona.etiqueta : TIPO_DEFECTO;
                if (tipo !== "Carga/Descarga") return { tipo, inferido: false, zona };
                const t = inferirMixta(visitasPrevias);
                if (t === undefined) return undefined;
                return t ? { tipo: t, inferido: true, zona } : { tipo, inferido: false, zona };
            }

            function calcularDashboard() {
                const ahora = Date.now();
                const d0 = inicioDelDia(ahora);
                const porDevice = eventosPorDevice();
                const st = {
                    d0,
                    pendientes: false,
                    operativos: { "Carga": [], "Descarga": [], "Carga/Descarga": [] },
                    inferidos: 0,
                    esperas: [],
                    carreteos: [],            // { dur, km }
                    // Igual que el feed: una demora de más de DEMORA_STANDBY_SEG es StandBy entera,
                    // así que una Demora nunca supera ese umbral. Se cuentan por separado.
                    demoras: [],              // { dur, devId, abierta }
                    standbys: [],             // { dur, devId, abierta }
                    control: {},
                    porZona: {},              // nombre -> { n, esperas: [], oper: [] }
                    porHora: { "Carga": Array(24).fill(0), "Descarga": Array(24).fill(0), "Carga/Descarga": Array(24).fill(0) },
                    activas: new Set()
                };

                vehiculos.forEach(veh => {
                    const evs = porDevice[veh.id] || [];
                    const { visitas } = reconstruirVisitas(evs);
                    const exits = evs.filter(e => e.rol === "EXIT");
                    let previaValida = null;

                    visitas.forEach((v, i) => {
                        if (!v.valida) return;
                        // Carreteo: del EXIT de la visita válida anterior al ENTER de esta
                        if (previaValida && v.enter.af >= d0) {
                            const desde = previaValida.exit.af;
                            const km = exits.filter(e => e.af >= desde && e.af < v.enter.af).reduce((s, e) => s + e.km, 0);
                            st.carreteos.push({ dur: v.enter.af - desde, km });
                            st.activas.add(veh.id);
                        }
                        previaValida = v;
                        if (v.exit.af < d0) return;
                        st.activas.add(veh.id);

                        if (v.enter.rol === "CONTROL") {
                            const etiqueta = REGLAS_GEOCERCA[v.enter.ruleId].etiqueta;
                            st.control[etiqueta] = (st.control[etiqueta] || 0) + 1;
                            return;
                        }

                        const t = tipoDeVisita(v.enter, visitas.slice(0, i));
                        if (t === undefined) { st.pendientes = true; return; }
                        if (!st.operativos[t.tipo]) return;

                        const stops = evs.filter(e => e.rol === "STOP" && e.af > v.enter.af && e.af <= v.exit.af);
                        const stop = stops[stops.length - 1] || null;
                        const espera = stop ? stop.af - v.enter.af : 0;
                        const oper = v.exit.af - (stop ? stop.af : v.enter.af);

                        st.operativos[t.tipo].push(oper);
                        if (t.inferido) st.inferidos++;
                        st.porHora[t.tipo][horaLocal(v.exit.af)]++;
                        if (stop) st.esperas.push(espera);

                        const nombre = t.zona ? t.zona.name : "Sin geocerca resuelta";
                        const z = st.porZona[nombre] = st.porZona[nombre] || { n: 0, esperas: [], oper: [] };
                        z.n++;
                        z.esperas.push(espera);
                        z.oper.push(oper);
                    });

                    // Demoras y StandBy que tocaron el día. La abierta es la que define el estado
                    // actual de la unidad: su duración corre hasta ahora.
                    evs.filter(e => e.rol === "DELAY" && (e.at || ahora) >= d0).forEach(e => {
                        const abierta = (veh.estado === "Demora" || veh.estado === "StandBy") && veh.desde === e.af;
                        const dur = (abierta ? ahora : (e.at || ahora)) - e.af;
                        const destino = dur > DEMORA_STANDBY_SEG * 1000 ? st.standbys : st.demoras;
                        destino.push({ dur, devId: veh.id, abierta });
                        st.activas.add(veh.id);
                    });
                });
                return st;
            }

            // Barras horizontales: [{ label, valor, texto, title }]
            function barrasH(filas, color) {
                if (filas.length === 0) return '<div class="mon-empty">Sin datos en el día</div>';
                const max = Math.max(...filas.map(f => f.valor)) || 1;
                return filas.map(f => `
                    <div class="mon-hbar" title="${esc(f.title || f.label)}">
                        <span class="mon-hbar-label">${esc(f.label)}</span>
                        <span class="mon-hbar-track"><span class="mon-hbar-fill" data-k="${esc((f.color || color) + '|' + f.label)}" data-w="${Math.max(2, f.valor / max * 100).toFixed(1)}" style="width:0; background:${f.color || color}; color:${f.color || color};"></span></span>
                        <span class="mon-hbar-val">${esc(f.texto)}</span>
                    </div>`).join('');
            }

            // Operativos finalizados por hora, apilados por tipo (2px de separación entre tramos)
            function barrasHora(porHora) {
                const tipos = ["Carga", "Descarga", "Carga/Descarga"];
                const horaActual = horaLocal(Date.now());
                const totales = Array.from({ length: 24 }, (_, h) => tipos.reduce((s, t) => s + porHora[t][h], 0));
                const max = Math.max(...totales) || 1;
                const cols = totales.map((tot, h) => {
                    const segs = tipos.filter(t => porHora[t][h] > 0).map(t =>
                        `<span style="height:${porHora[t][h] / max * 100}%; background:${ESTADOS[t].color};"></span>`).join('');
                    const detalle = tipos.map(t => `${t}: ${porHora[t][h]}`).join(' · ');
                    return `<div class="mon-vcol${h > horaActual ? ' mon-vcol-futuro' : ''}" title="${String(h).padStart(2, '0')}:00 · ${tot} operativos (${detalle})">
                                <div class="mon-vcol-bar">${segs}</div>
                                <div class="mon-vcol-x">${h % 3 === 0 ? String(h).padStart(2, '0') : ''}</div>
                            </div>`;
                }).join('');
                const leyenda = tipos.map(t => `<span class="mon-leg"><i style="background:${ESTADOS[t].color};"></i>${t}</span>`).join('');
                return `<div class="mon-legend">${leyenda}</div><div class="mon-vchart">${cols}</div>`;
            }

            const tile = (valor, label, sub, tono) => `
                <div class="mon-tile${tono ? ' mon-tile-' + tono : ''}">
                    <div class="mon-tile-val"${typeof valor === 'number' ? ` data-num="${valor}" data-k="${esc(label)}"` : ''}>${typeof valor === 'number' ? valor.toLocaleString('es-AR') : valor}</div>
                    <div class="mon-tile-label">${label}</div>
                    ${sub ? `<div class="mon-tile-sub">${sub}</div>` : ''}
                </div>`;

            async function renderDashboard() {
                const cont = elt.querySelector("#mon-dash");
                if (dashCalculando) return;
                dashCalculando = true;
                try {
                    let st = calcularDashboard();
                    for (let pase = 0; pase < 5 && zona_pendientes.size > 0; pase++) {
                        if (pase === 0 && !cont.innerHTML) cont.innerHTML = '<div class="mon-empty">Calculando estadísticas del día...</div>';
                        await zona_resolverPendientes();
                        st = calcularDashboard();
                    }
                    // El gráfico por hora crece solo al abrir el dashboard, no en cada refresco
                    cont.classList.toggle('mon-dash-primera', Object.keys(dash_prev).length === 0);
                    cont.innerHTML = htmlDashboard(st);
                    dash_animar(cont);
                } catch (err) {
                    console.error("[DASH]", err);
                    cont.innerHTML = `<div class="mon-empty">Error al calcular: ${esc(err.message)}</div>`;
                } finally {
                    dashCalculando = false;
                }
            }

            function htmlDashboard(st) {
                const nC = st.operativos["Carga"].length;
                const nD = st.operativos["Descarga"].length;
                const nCD = st.operativos["Carga/Descarga"].length;
                const kmTotal = st.carreteos.reduce((s, c) => s + c.km, 0);
                const durDem = st.demoras.map(d => d.dur);
                const durSb = st.standbys.map(d => d.dur);
                const fmt = ms => ms == null ? '-' : formatDuracion(ms);
                const maximo = arr => arr.length ? Math.max(...arr) : null;

                // Estado actual de la flota
                const porEstado = {};
                vehiculos.forEach(v => { porEstado[v.estado] = (porEstado[v.estado] || 0) + 1; });
                const filasEstado = Object.keys(ESTADOS).filter(e => porEstado[e]).map(e => ({
                    label: e, valor: porEstado[e], texto: String(porEstado[e]), color: ESTADOS[e].color
                }));

                // Geocercas: mayor espera promedio, y las más visitadas
                const zonas = Object.entries(st.porZona).map(([nombre, z]) => ({
                    nombre, n: z.n, espera: promedio(z.esperas), oper: promedio(z.oper),
                    conEspera: z.esperas.filter(x => x > 0).length
                }));
                const filasEspera = zonas.filter(z => z.espera > 0).sort((a, b) => b.espera - a.espera).slice(0, 8).map(z => ({
                    label: z.nombre, valor: z.espera, texto: fmt(z.espera),
                    title: `${z.nombre}: espera promedio ${fmt(z.espera)} · ${z.n} visitas (${z.conEspera} con espera) · operativo promedio ${fmt(z.oper)}`
                }));
                const filasVisitas = zonas.sort((a, b) => b.n - a.n).slice(0, 8).map(z => ({
                    label: z.nombre, valor: z.n, texto: String(z.n),
                    title: `${z.nombre}: ${z.n} operativos · operativo promedio ${fmt(z.oper)}`
                }));

                // Unidades con más tiempo acumulado en el día, por separado para Demora y StandBy
                const topUnidades = (lista, que) => {
                    const porUnidad = {};
                    lista.forEach(d => { porUnidad[d.devId] = (porUnidad[d.devId] || 0) + d.dur; });
                    return Object.entries(porUnidad).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([id, ms]) => {
                        const v = vehiculoPorId(id);
                        const nombre = v ? v.name : id;
                        const n = lista.filter(d => d.devId === id).length;
                        return { label: nombre, valor: ms, texto: fmt(ms), title: `${nombre}: ${fmt(ms)} en ${que} hoy (${n})` };
                    });
                };
                const filasDemUnidad = topUnidades(st.demoras, 'Demora');
                const filasSbUnidad = topUnidades(st.standbys, 'StandBy');

                // Carreteos en curso hace más tiempo
                const filasCarreteo = vehiculos.filter(v => ESTADOS[v.estado] && ESTADOS[v.estado].cat === "carreteo").sort((a, b) => a.desde - b.desde).slice(0, 5).map(v => ({
                    label: v.name, valor: Date.now() - v.desde, texto: fmt(Date.now() - v.desde),
                    color: ESTADOS[v.estado].color,
                    title: `${v.name}: ${etiquetaEstado(v)} hace ${fmt(Date.now() - v.desde)}${v.km != null ? ' · ' + v.km + ' km' : ''}`
                }));

                const controles = ["Estacion de Servicio", "Relevo", "Gomeria", "Taller"];
                const sinComunicar = vehiculos.filter(v => v.communicates === false).length;

                return `
                    <div class="mon-dash-head">Hoy desde las <b>00:00</b> · <b>${st.activas.size}</b> unidades con actividad de <b>${vehiculos.length}</b>
                        ${st.pendientes ? '<br><span class="mon-tag mon-tag-warn" style="margin-top:6px;">Algunas geocercas siguen resolviéndose</span>' : ''}</div>

                    <div class="mon-sec">Operativos finalizados</div>
                    <div class="mon-tiles">
                        ${tile(nC, 'Cargas', `prom. ${fmt(promedio(st.operativos["Carga"]))}`)}
                        ${tile(nD, 'Descargas', `prom. ${fmt(promedio(st.operativos["Descarga"]))}`)}
                        ${tile(nCD, 'Carga/Descarga', st.inferidos ? `${st.inferidos} mixtas inferidas como C o D` : 'mixtas sin inferir')}
                    </div>
